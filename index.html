<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heart Animation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: radial-gradient(circle at center, #1a1a2e 0%, #0f0f1b 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
    }

    .title {
      margin-bottom: 50px;
      font-size: 2rem;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(255, 46, 99, 0.6);
    }

    .heart-container {
      position: relative;
      cursor: pointer;
      user-select: none;
      margin: 20px 0;
      /* เพิ่มพื้นที่สำหรับรับแรงคลิกให้กว้างขึ้น */
      padding: 30px;
    }

    .heart {
      background-color: #ff2e63;
      display: inline-block;
      height: 100px;
      position: relative;
      transform: rotate(-45deg);
      width: 100px;
      animation: pulse 1.2s infinite ease-in-out;
      box-shadow: 0 0 40px #ff2e63;
    }

    .heart:before,
    .heart:after {
      content: "";
      background-color: #ff2e63;
      border-radius: 50%;
      height: 100px;
      position: absolute;
      width: 100px;
    }

    .heart:before {
      top: -50px;
      left: 0;
    }

    .heart:after {
      left: 50px;
      top: 0;
    }

    .instruction {
      margin-top: 50px;
      font-size: 0.95rem;
      opacity: 0.8;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes pulse {
      0% { transform: rotate(-45deg) scale(1); }
      14% { transform: rotate(-45deg) scale(1.2); }
      28% { transform: rotate(-45deg) scale(1); }
      42% { transform: rotate(-45deg) scale(1.1); }
      70% { transform: rotate(-45deg) scale(1); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
  </style>
</head>
<body>

  <h1 class="title">Heart Animation</h1>

  <div class="heart-container" id="heartBtn">
    <div class="heart"></div>
  </div>

  <p class="instruction">💡 คลิกที่รูปหัวใจเพื่อปล่อยประกายดาว</p>

  <script>
    const heartBtn = document.getElementById('heartBtn');

    // เปลี่ยนมาดึงพิกัด e.clientX และ e.clientY จากตำแหน่งเมาส์ตรงๆ
    heartBtn.addEventListener('click', (e) => {
      const clickX = e.clientX;
      const clickY = e.clientY;

      for (let i = 0; i < 25; i++) {
        createParticle(clickX, clickY);
      }
    });

    function createParticle(x, y) {
      const particle = document.createElement('div');
      document.body.appendChild(particle);

      const size = Math.random() * 12 + 6;
      const colors = ['#ff2e63', '#ff7597', '#ffffff', '#ffb3c6', '#ffd1dc'];
      const color = colors[Math.floor(Math.random() * colors.length)];

      particle.style.width = size + 'px';
      particle.style.height = size + 'px';
      particle.style.backgroundColor = color;
      particle.style.borderRadius = '50%';
      particle.style.position = 'fixed';
      particle.style.left = x + 'px';
      particle.style.top = y + 'px';
      particle.style.pointerEvents = 'none';
      particle.style.boxShadow = `0 0 10px ${color}`;
      particle.style.zIndex = '9999';

      const angle = Math.random() * Math.PI * 2;
      const dist = Math.random() * 140 + 50;
      const destX = Math.cos(angle) * dist;
      const destY = Math.sin(angle) * dist;

      const anim = particle.animate([
        { transform: 'translate(-50%, -50%) scale(1)', opacity: 1 },
        { transform: `translate(calc(-50% + ${destX}px), calc(-50% + ${destY}px)) scale(0)`, opacity: 0 }
      ], {
        duration: 700 + Math.random() * 500,
        easing: 'cubic-bezier(0, .9, .57, 1)'
      });

      anim.onfinish = () => particle.remove();
    }
  </script>
</body>
</html>
