<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Cinematic Heart Particle Explosion & Assembly</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            width: 100%; height: 100%;
            background-color: #000000;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "TH Sarabun New", "Prompt", "Segoe UI", Roboto, sans-serif;
            touch-action: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #mobile-frame {
            position: relative;
            width: 100%;
            max-width: 430px;
            height: 100%;
            max-height: 932px;
            background: #000000;
            overflow: hidden;
        }

        #webgl-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/math/MeshSurfaceSampler.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
</head>
<body>

    <div id="mobile-frame">
        <div id="webgl-container"></div>
    </div>

    <script>
        const PARTICLE_COUNT = 35000;

        const ShapeEngine = (() => {
            function sampleHeartPositions(particleCount) {
                const shape = new THREE.Shape();
                shape.moveTo(0, 2.5);
                shape.bezierCurveTo(0, 2.5, -0.5, 0, -2.5, 0);
                shape.bezierCurveTo(-5.5, 0, -5.5, 3.5, -5.5, 3.5);
                shape.bezierCurveTo(-5.5, 5.5, -3.5, 7.7, 0, 10);
                shape.bezierCurveTo(3.5, 7.7, 5.5, 5.5, 5.5, 3.5);
                shape.bezierCurveTo(5.5, 3.5, 5.5, 0, 2.5, 0);
                shape.bezierCurveTo(0.5, 0, 0, 2.5, 0, 2.5);

                const geom = new THREE.ExtrudeGeometry(shape, { depth: 2.2, bevelEnabled: true, bevelSegments: 4, steps: 2, bevelSize: 0.9, bevelThickness: 0.9 });
                geom.center();
                geom.rotateZ(Math.PI);
                geom.scale(0.7, 0.7, 0.7);

                const mesh = new THREE.Mesh(geom);
                let sampler;
                try {
                    sampler = new THREE.MeshSurfaceSampler(mesh).build();
                } catch (e) {
                    geom.computeVertexNormals();
                    sampler = new THREE.MeshSurfaceSampler(mesh).build();
                }

                const targetPositions = new Float32Array(particleCount * 3);
                const tempVec = new THREE.Vector3();
                for (let i = 0; i < particleCount; i++) {
                    sampler.sample(tempVec);
                    targetPositions[i * 3]       = tempVec.x;
                    targetPositions[i * 3 + 1] = tempVec.y;
                    targetPositions[i * 3 + 2] = tempVec.z;
                }
                return targetPositions;
            }

            return { sampleHeartPositions };
        })();

        const ParticleEngine = (() => {
            let shaderMaterial, pointsMesh, particleGroup;
            let groundGlowMesh, groundMaterial;

            const THEMES = [
                { core: [1,1,1], mid: [0,0.94,1], edge: [0,0.2,1] },       // ฟ้า Electric Blue
                { core: [1,1,1], mid: [1,0,0.49], edge: [0.53,0,1] },     // ชมพู Pink
                { core: [1,1,1], mid: [0.69,0,1], edge: [0.23,0,0.51] },  // ม่วง Purple
                { core: [1,1,1], mid: [1,0.8,0], edge: [1,0.33,0] },      // ทอง Gold
                { core: [1,1,1], mid: [0,1,0.8], edge: [0,0.5,0.8] }      // มิ้นต์ Cyan
            ];

            const ParticleShader = {
                uniforms: {
                    uTime: { value: 0 },
                    uProgress: { value: 0 },
                    uTransitionMode: { value: 0 },
                    uExplosionType: { value: 0 },
                    uColorCore: { value: new THREE.Vector3(1, 1, 1) },
                    uColorMid: { value: new THREE.Vector3(0, 0.94, 1) },
                    uColorEdge: { value: new THREE.Vector3(0, 0.2, 1) },
                    uPointSize: { value: 3.5 }
                },
                vertexShader: `
                    uniform float uTime;
                    uniform float uProgress;
                    uniform int uTransitionMode;
                    uniform int uExplosionType;
                    uniform vec3 uColorCore;
                    uniform vec3 uColorMid;
                    uniform vec3 uColorEdge;
                    uniform float uPointSize;

                    attribute vec3 targetPosition;
                    attribute vec3 scatterPosition;
                    attribute vec3 explosionVelocity1;
                    attribute vec3 explosionVelocity2;
                    attribute vec3 explosionVelocity3;
                    attribute vec3 explosionVelocity4;
                    attribute float particlePhase;
                    attribute float staggerOffset;
                    attribute float randomSize;
                    attribute float isSparkle;

                    varying vec3 vColor;

                    void main() {
                        vec3 pos = vec3(0.0);
                        
                        // เคล็ดลับ 1: สร้าง Wave Delay จากระยะทาง (แกน Y และความลึก) ให้เกิดการแตกตัว/รวมตัวแบบเป็นคลื่น
                        float distFromCenter = length(targetPosition);
                        float spatialDelay = (targetPosition.y * 0.15) + (distFromCenter * 0.12) + (staggerOffset * 0.4);

                        // เลือกเวกเตอร์แรงระเบิด
                        vec3 currentVel = explosionVelocity1;
                        if (uExplosionType == 1) currentVel = explosionVelocity2;
                        else if (uExplosionType == 2) currentVel = explosionVelocity3;
                        else if (uExplosionType == 3) currentVel = explosionVelocity4;

                        if (uTransitionMode == 0) {
                            // --- Dynamic Wave Assembly (ทยอยไหลกลับแบบระลอกคลื่น) ---
                            // คำนวณความล่าช้าของแต่ละเม็ดพาร์ทิเคิล (ให้ข้างล่างมารวมก่อน ข้างบนทยอยตามมา)
                            float localT = clamp((uProgress - spatialDelay * 0.2) / (1.0 - 0.2), 0.0, 1.0);
                            
                            // Cubic Ease-out ให้การดึงกลับนุ่มนวล
                            float p = smoothstep(0.0, 1.0, localT);
                            float easedReverse = (1.0 - p) * (1.0 - p) * (1.0 - p);

                            vec3 startDisplacement = currentVel * (5.0 + sin(particlePhase * 3.0) * 1.5);
                            
                            // แรงเหวี่ยงสลับทิศทางตามค่า phase ทำให้การดึงกลับดูมีเส้นสายสลับซับซ้อน
                            float swirlAngle = easedReverse * (1.5 + sin(particlePhase) * 1.0);
                            mat2 rot = mat2(cos(swirlAngle), sin(swirlAngle), -sin(swirlAngle), cos(swirlAngle));
                            startDisplacement.xz = rot * startDisplacement.xz;

                            pos = targetPosition + startDisplacement * easedReverse;

                        } else if (uTransitionMode == 1) {
                            // --- Heart Pulse & Floating Sparkles ---
                            pos = targetPosition;
                            
                            // ชีพจรหัวใจเต้นพริ้วไหว
                            float beat = sin(uTime * 3.0 + distFromCenter * 0.5) * 0.12;
                            pos += normalize(targetPosition + vec3(0.001)) * beat;

                            if (isSparkle > 0.5) {
                                float floatSpeed = uTime * 2.5 + particlePhase * 8.0;
                                pos += vec3(
                                    sin(floatSpeed) * 1.8,
                                    mod(floatSpeed * 0.8, 6.0) - 3.0,
                                    cos(floatSpeed * 0.6) * 1.8
                                );
                            }
                        } else if (uTransitionMode == 2) {
                            // --- Multi-stage Explosion (ระเบิดแตกตัวเป็นระลอกคลื่น) ---
                            // ใช้ Delay เพื่อให้ศูนย์กลางพุ่งออกมาก่อน แล้วส่วนขอบค่อยระเบิดตาม
                            float localT = max(0.0, uProgress - (spatialDelay * 0.15));
                            
                            // ฟิสิกส์การพุ่งแบบชะลอตัว (Decay) + แรงโน้มถ่วงอ่อนๆ
                            float expProgress = (1.0 - exp(-localT * 3.2)) * 6.0;
                            
                            // เกลียวหมุนระเบิดที่ไม่เท่ากันในแต่ละเม็ด
                            float swirl = expProgress * (0.1 + randomSize * 0.1);
                            mat2 rot = mat2(cos(swirl), -sin(swirl), sin(swirl), cos(swirl));
                            vec3 animatedVel = currentVel;
                            animatedVel.xz = rot * animatedVel.xz;

                            // เพิ่มการตกร่วงตามแรงโน้มถ่วงเล็กน้อยช่วงปลายของการระเบิด
                            vec3 gravity = vec3(0.0, -0.15 * expProgress * expProgress, 0.0);

                            pos = targetPosition + animatedVel * expProgress + gravity;
                            
                            // ความสั่นสะเทือนสุ่มเล็กน้อย
                            pos += vec3(
                                sin(uTime * 4.0 + particlePhase), 
                                cos(uTime * 3.5 + particlePhase), 
                                sin(uTime * 4.5 + particlePhase)
                            ) * (expProgress * 0.05);
                        }

                        float dist = length(targetPosition) / 4.5;
                        if (dist < 0.3) vColor = uColorCore;
                        else if (dist < 0.7) vColor = mix(uColorCore, uColorMid, dist);
                        else vColor = mix(uColorMid, uColorEdge, dist);

                        if (isSparkle > 0.5 && uTransitionMode == 1) {
                            vColor = mix(vColor, vec3(1.0, 1.0, 1.0), 0.7);
                        }

                        vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                        float depthFactor = clamp(28.0 / -mvPosition.z, 0.4, 3.5);
                        gl_PointSize = (uPointSize * randomSize) * depthFactor;
                        gl_Position = projectionMatrix * mvPosition;
                    }
                `,
                fragmentShader: `
                    varying vec3 vColor;
                    void main() {
                        float d = length(gl_PointCoord - vec2(0.5));
                        if (d > 0.5) discard;
                        
                        float glow = exp(-d * 5.5);
                        float alpha = smoothstep(0.5, 0.0, d) * glow;
                        
                        vec3 finalColor = mix(vColor, vec3(1.0), pow(glow, 3.0) * 0.45);
                        gl_FragColor = vec4(finalColor, alpha);
                    }
                `
            };

            function init(scene) {
                particleGroup = new THREE.Group();
                const geometry = new THREE.BufferGeometry();
                const positions = new Float32Array(PARTICLE_COUNT * 3);
                const targetPositions = ShapeEngine.sampleHeartPositions(PARTICLE_COUNT);
                const scatterPositions = new Float32Array(PARTICLE_COUNT * 3);

                const exp1 = new Float32Array(PARTICLE_COUNT * 3);
                const exp2 = new Float32Array(PARTICLE_COUNT * 3);
                const exp3 = new Float32Array(PARTICLE_COUNT * 3);
                const exp4 = new Float32Array(PARTICLE_COUNT * 3);
                const phases = new Float32Array(PARTICLE_COUNT);
                const staggers = new Float32Array(PARTICLE_COUNT);
                const randomSizes = new Float32Array(PARTICLE_COUNT);
                const sparkles = new Float32Array(PARTICLE_COUNT);

                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    scatterPositions[i*3]     = (Math.random() - 0.5) * 50.0;
                    scatterPositions[i*3 + 1] = (Math.random() - 0.5) * 50.0;
                    scatterPositions[i*3 + 2] = (Math.random() - 0.5) * 45.0;

                    const tp = new THREE.Vector3(targetPositions[i*3], targetPositions[i*3+1], targetPositions[i*3+2]);
                    const len = tp.length() || 1;

                    // รูปแบบที่ 1: พุ่งออกจากศูนย์กลางแบบมีความเร็วต่างกันมาก (น้ำหนักพาร์ทิเคิลไม่เท่ากัน)
                    const speedVar1 = 1.5 + Math.random() * 4.5;
                    exp1[i*3] = (tp.x / len) * speedVar1;
                    exp1[i*3+1] = (tp.y / len) * speedVar1;
                    exp1[i*3+2] = (tp.z / len) * speedVar1;

                    // รูปแบบที่ 2: พายุวนระเบิดบิดเกลียว
                    exp2[i*3] = -tp.y * 1.5 + (Math.random() - 0.5) * 5.0;
                    exp2[i*3+1] = tp.x * 1.5 + (Math.random() - 0.5) * 5.0;
                    exp2[i*3+2] = tp.z * 2.5;

                    // รูปแบบที่ 3: น้ำพุแสงพุ่งขึ้นฟ้าแล้วทยอยร่วงลงมา
                    exp3[i*3] = (Math.random() - 0.5) * 5.0;
                    exp3[i*3+1] = 5.0 + Math.random() * 9.0;
                    exp3[i*3+2] = (Math.random() - 0.5) * 5.0;

                    // รูปแบบที่ 4: จักรวาลระเบิดออกสองฝั่งขวา-ซ้าย (Cross Explosion)
                    exp4[i*3] = tp.x * 4.5;
                    exp4[i*3+1] = (Math.random() - 0.5) * 3.0;
                    exp4[i*3+2] = tp.z * 4.5;

                    phases[i] = Math.random() * Math.PI * 2;
                    staggers[i] = (Math.random() - 0.5) * 1.0; // กระจายการเหลื่อมเวลาให้กว้างขึ้น
                    randomSizes[i] = 0.2 + Math.random() * 1.8;
                    sparkles[i] = (Math.random() < 0.18) ? 1.0 : 0.0;
                }

                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                geometry.setAttribute('targetPosition', new THREE.BufferAttribute(targetPositions, 3));
                geometry.setAttribute('scatterPosition', new THREE.BufferAttribute(scatterPositions, 3));
                geometry.setAttribute('explosionVelocity1', new THREE.BufferAttribute(exp1, 3));
                geometry.setAttribute('explosionVelocity2', new THREE.BufferAttribute(exp2, 3));
                geometry.setAttribute('explosionVelocity3', new THREE.BufferAttribute(exp3, 3));
                geometry.setAttribute('explosionVelocity4', new THREE.BufferAttribute(exp4, 3));
                geometry.setAttribute('particlePhase', new THREE.BufferAttribute(phases, 1));
                geometry.setAttribute('staggerOffset', new THREE.BufferAttribute(staggers, 1));
                geometry.setAttribute('randomSize', new THREE.BufferAttribute(randomSizes, 1));
                geometry.setAttribute('isSparkle', new THREE.BufferAttribute(sparkles, 1));

                shaderMaterial = new THREE.ShaderMaterial({
                    uniforms: THREE.UniformsUtils.clone(ParticleShader.uniforms),
                    vertexShader: ParticleShader.vertexShader,
                    fragmentShader: ParticleShader.fragmentShader,
                    transparent: true,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false
                });

                pointsMesh = new THREE.Points(geometry, shaderMaterial);
                particleGroup.add(pointsMesh);
                scene.add(particleGroup);

                // --- Ground Glow ---
                const canvas = document.createElement('canvas');
                canvas.width = 256;
                canvas.height = 256;
                const ctx = canvas.getContext('2d');
                const gradient = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
                gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
                gradient.addColorStop(0.3, 'rgba(255, 255, 255, 0.4)');
                gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, 256, 256);

                const texture = new THREE.CanvasTexture(canvas);
                const groundGeo = new THREE.PlaneGeometry(22, 22);
                groundMaterial = new THREE.MeshBasicMaterial({
                    map: texture,
                    color: 0x00e6ff,
                    transparent: true,
                    opacity: 0.3,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false
                });
                groundGlowMesh = new THREE.Mesh(groundGeo, groundMaterial);
                groundGlowMesh.rotation.x = -Math.PI / 2;
                groundGlowMesh.position.y = -6.8;
                scene.add(groundGlowMesh);
            }

            function setTheme(themeIndex) {
                const theme = THEMES[themeIndex % THEMES.length];
                shaderMaterial.uniforms.uColorCore.value.set(theme.core[0], theme.core[1], theme.core[2]);
                shaderMaterial.uniforms.uColorMid.value.set(theme.mid[0], theme.mid[1], theme.mid[2]);
                shaderMaterial.uniforms.uColorEdge.value.set(theme.edge[0], theme.edge[1], theme.edge[2]);
                
                if (groundMaterial) {
                    groundMaterial.color.setRGB(theme.mid[0], theme.mid[1], theme.mid[2]);
                }
            }

            function setUniforms(time, progress, mode, expType) {
                shaderMaterial.uniforms.uTime.value = time;
                shaderMaterial.uniforms.uProgress.value = progress;
                shaderMaterial.uniforms.uTransitionMode.value = mode;
                shaderMaterial.uniforms.uExplosionType.value = expType;
            }

            return { init, setTheme, setUniforms, getGroup: () => particleGroup, getGroundMaterial: () => groundMaterial };
        })();

        const TimelineEngine = (() => {
            let container, scene, camera, renderer, composer, bloomPass, controls;
            let clock = new THREE.Clock();
            let stateTimer = 0;
            let currentExplosionType = 0;
            let currentThemeIdx = 0;
            let isFirstRun = true;
            const CYCLE_DURATION = 9.5;

            function init() {
                container = document.getElementById('webgl-container');
                scene = new THREE.Scene();

                camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
                camera.position.set(0, 0, 26);

                renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
                renderer.setSize(container.clientWidth, container.clientHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                renderer.toneMapping = THREE.ACESFilmicToneMapping;
                renderer.toneMappingExposure = 1.2;
                container.appendChild(renderer.domElement);

                controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
                controls.dampingFactor = 0.05;
                controls.minDistance = 10;
                controls.maxDistance = 45;
                controls.autoRotate = true;
                controls.autoRotateSpeed = 1.0;

                const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
                scene.add(ambientLight);

                const renderScene = new THREE.RenderPass(scene, camera);
                bloomPass = new THREE.UnrealBloomPass(
                    new THREE.Vector2(container.clientWidth, container.clientHeight), 
                    1.45,
                    0.55,
                    0.12
                );

                composer = new THREE.EffectComposer(renderer);
                composer.addPass(renderScene);
                composer.addPass(bloomPass);

                ParticleEngine.init(scene);
                ParticleEngine.setTheme(0);

                window.addEventListener('resize', onWindowResize);
                animate();
            }

            function animate() {
                requestAnimationFrame(animate);

                const delta = Math.min(clock.getDelta(), 0.08);
                const time = clock.getElapsedTime();
                stateTimer += delta;

                if (stateTimer > CYCLE_DURATION) {
                    stateTimer = 0;
                    isFirstRun = false;
                    currentExplosionType = Math.floor(Math.random() * 4);
                    currentThemeIdx++;
                    ParticleEngine.setTheme(currentThemeIdx);
                }

                let shaderMode = 0;
                let shaderProgress = 0;

                if (isFirstRun && stateTimer < 2.8) {
                    shaderMode = 0;
                    shaderProgress = stateTimer / 2.8;
                } else if (!isFirstRun && stateTimer < 2.8) {
                    shaderMode = 0;
                    shaderProgress = stateTimer / 2.8;
                } else {
                    const threshold = 2.8;
                    if (stateTimer >= threshold && stateTimer < 6.2) {
                        shaderMode = 1;
                        shaderProgress = 1.0;
                    } else {
                        shaderMode = 2;
                        shaderProgress = (stateTimer - 6.2) / 3.3;
                    }
                }

                const gMat = ParticleEngine.getGroundMaterial();
                if (gMat) {
                    if (shaderMode === 1) {
                        gMat.opacity = 0.25 + Math.sin(time * 3.5) * 0.08;
                    } else if (shaderMode === 2) {
                        gMat.opacity = Math.max(0.0, 0.45 - shaderProgress * 0.45);
                    } else {
                        gMat.opacity = shaderProgress * 0.3;
                    }
                }

                ParticleEngine.setUniforms(time, shaderProgress, shaderMode, currentExplosionType);

                controls.update();
                ParticleEngine.getGroup().rotation.y += 0.005;

                try {
                    composer.render();
                } catch (e) {
                    renderer.render(scene, camera);
                }
            }

            function onWindowResize() {
                const width = container.clientWidth;
                const height = container.clientHeight;
                camera.aspect = width / height;
                camera.updateProjectionMatrix();
                renderer.setSize(width, height);
                composer.setSize(width, height);
            }

            return { init };
        })();

        window.addEventListener('DOMContentLoaded', TimelineEngine.init);
    </script>
</body>
</html>
