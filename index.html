<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Organic Fluid Heart 💙</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 100vw;
            height: 100vh;
            background-color: #010005;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
        }
        #webgl-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
</head>
<body>

    <div id="webgl-container"></div>

    <script>
        // --- 1. SETUP SCENE, CAMERA & RENDERER ---
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        function updateResponsiveCamera() {
            const aspect = window.innerWidth / window.innerHeight;
            camera.aspect = aspect;
            if (aspect < 1.0) {
                camera.position.set(0, 0.5, 22 / aspect * 0.72);
            } else {
                camera.position.set(0, 0.5, 22);
            }
            camera.updateProjectionMatrix();
        }

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ReinhardToneMapping;
        container.appendChild(renderer.domElement);

        updateResponsiveCamera();

        // --- 1.5 POST-PROCESSING ---
        const renderScene = new THREE.RenderPass(scene, camera);
        const bloomPass = new THREE.UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            0.0,
            0.5,
            0.12
        );

        const composer = new THREE.EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        // --- 2. GLOW SPRITE TEXTURE ---
        function createGlowDot() {
            const canvas = document.createElement('canvas');
            canvas.width = 128; canvas.height = 128;
            const ctx = canvas.getContext('2d');

            const grad = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
            grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
            grad.addColorStop(0.2, 'rgba(0, 240, 255, 0.9)');
            grad.addColorStop(0.5, 'rgba(0, 80, 255, 0.3)');
            grad.addColorStop(1, 'rgba(0, 0, 0, 0)');

            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 128, 128);
            const tex = new THREE.Texture(canvas);
            tex.needsUpdate = true;
            return tex;
        }

        // --- 3. PARTICLES SETUP ---
        const particleCount = 35000;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);

        const colorCyan = new THREE.Color("#00f0ff");
        const colorBlue = new THREE.Color("#0044ff");
        const colorDeepPurple = new THREE.Color("#8800ff");
        const colorWhite = new THREE.Color("#ffffff");

        const particlesData = [];

        for (let i = 0; i < particleCount; i++) {
            const t = Math.PI * (Math.random() * 2 - 1);
            
            let bx = 16 * Math.pow(Math.sin(t), 3);
            let by = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
            
            const isTopArea = by > 0;
            const topSoftness = isTopArea ? (Math.random() * 0.35 + 0.85) : 1.0;

            const r = Math.pow(Math.random(), 1.8) * topSoftness;
            const spreadZ = (Math.random() - 0.5) * 7.5 * (1.0 - Math.abs(t) / Math.PI);

            const scale = 0.46;
            let tx = bx * r * scale;
            let ty = (by * r + 1.2) * scale;
            let tz = spreadZ * scale;

            const sx = (Math.random() - 0.5) * 0.3;
            const sy = 0.8 + (Math.random() - 0.5) * 0.3;
            const sz = (Math.random() - 0.5) * 0.3;

            positions[i * 3] = sx;
            positions[i * 3 + 1] = sy;
            positions[i * 3 + 2] = sz;

            const isBottomStream = ty < 0.1 && Math.random() < 0.6;

            particlesData.push({
                sx: sx, sy: sy, sz: sz,
                ex: 0, ey: 0, ez: 0, // ตำแหน่งเป้าหมายการระเบิด (จะถูกสุ่มใหม่ทุกรอบ)
                tx: tx, ty: ty, tz: tz,
                cx: sx, cy: sy, cz: sz,
                speed: Math.random() * 0.035 + 0.015,
                fallSpeed: Math.random() * 0.06 + 0.02,
                isStream: isBottomStream,
                isTop: isTopArea,
                phaseX: Math.random() * Math.PI * 2,
                phaseY: Math.random() * Math.PI * 2,
                phaseZ: Math.random() * Math.PI * 2,
                swirlSpeed: Math.random() * 0.03 + 0.01,
                distFromCenter: r
            });

            colors[i * 3] = colorWhite.r;
            colors[i * 3 + 1] = colorWhite.g;
            colors[i * 3 + 2] = colorWhite.b;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const material = new THREE.PointsMaterial({
            size: 0.48,
            map: createGlowDot(),
            transparent: true,
            opacity: 0.88,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            vertexColors: true
        });

        const heartGroup = new THREE.Group();
        const heartPoints = new THREE.Points(geometry, material);
        heartGroup.add(heartPoints);
        scene.add(heartGroup);

        // --- 4. FLOOR GLOW ---
        function createFloorGlowTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');

            const grad = ctx.createRadialGradient(128, 128, 0, 128, 128, 120);
            grad.addColorStop(0, 'rgba(0, 230, 255, 0.8)');
            grad.addColorStop(0.25, 'rgba(0, 100, 255, 0.4)');
            grad.addColorStop(0.55, 'rgba(120, 0, 255, 0.15)');
            grad.addColorStop(1, 'rgba(0, 0, 0, 0)');

            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 256, 256);
            const tex = new THREE.Texture(canvas);
            tex.needsUpdate = true;
            return tex;
        }

        const floorGeo = new THREE.PlaneGeometry(24, 24);
        const floorMat = new THREE.MeshBasicMaterial({
            map: createFloorGlowTexture(),
            transparent: true,
            opacity: 0,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });
        const floorMesh = new THREE.Mesh(floorGeo, floorMat);
        floorMesh.rotation.x = -Math.PI / 2;
        floorMesh.position.y = -6.8;
        scene.add(floorMesh);

        // --- 5. INTERACTION ---
        let mouseX = 0, mouseY = 0;

        function updatePointer(clientX, clientY) {
            mouseX = (clientX / window.innerWidth) * 2 - 1;
            mouseY = -(clientY / window.innerHeight) * 2 + 1;
        }

        window.addEventListener('mousemove', (e) => updatePointer(e.clientX, e.clientY));
        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) updatePointer(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: true });

        // --- 5.5 DYNAMIC EXPLOSION GENERATOR (สุ่มรูปแบบการระเบิดประจำรอบ) ---
        let explosionModeIndex = 0;

        function generateNewExplosionMode() {
            explosionModeIndex = (explosionModeIndex + 1) % 4; // วนสลับ 4 รูปแบบ

            for (let i = 0; i < particleCount; i++) {
                const p = particlesData[i];

                if (explosionModeIndex === 0) {
                    // MODE 0: Vortex Twister (เกลียวพายุระเบิดวน)
                    const angle = p.phaseX * 2;
                    const radius = 10 + Math.random() * 20;
                    p.ex = Math.cos(angle) * radius;
                    p.ey = (Math.random() - 0.5) * 16;
                    p.ez = Math.sin(angle) * radius;
                } else if (explosionModeIndex === 1) {
                    // MODE 1: Supernova Shockwave (ดวงดาวระเบิดทรงกลมรัศมีกว้าง)
                    const phi = Math.acos((Math.random() * 2) - 1);
                    const theta = Math.random() * Math.PI * 2;
                    const dist = 16 + Math.random() * 20;
                    p.ex = Math.sin(phi) * Math.cos(theta) * dist;
                    p.ey = Math.sin(phi) * Math.sin(theta) * dist;
                    p.ez = Math.cos(phi) * dist;
                } else if (explosionModeIndex === 2) {
                    // MODE 2: Pulsar Ring (ระเบิดออกเป็นวงแหวนพลังงานเฉียง)
                    const angle = Math.random() * Math.PI * 2;
                    const dist = 12 + Math.random() * 22;
                    p.ex = Math.cos(angle) * dist;
                    p.ey = Math.sin(angle) * (dist * 0.3) + (Math.random() - 0.5) * 4;
                    p.ez = Math.sin(angle) * dist;
                } else {
                    // MODE 3: Chaos Turbulence (ฟุ้งกระจายไร้ทิศทาง)
                    p.ex = (Math.random() - 0.5) * 38;
                    p.ey = (Math.random() - 0.5) * 38;
                    p.ez = (Math.random() - 0.5) * 38;
                }
            }
        }

        // คำนวณเวกเตอร์ระเบิดรอบแรกสุด
        generateNewExplosionMode();

        // --- 6. STATE CONTROL ---
        const clock = new THREE.Clock();
        
        let rotationAngle = 0;
        let cycleState = -2; 
        let stateTimer = 0;

        function easeOutCubic(x) {
            return 1 - Math.pow(1 - x, 3);
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const elapsedTime = clock.getElapsedTime();
            const posAttr = geometry.attributes.position;
            const colAttr = geometry.attributes.color;

            stateTimer += delta;

            if (cycleState === -2) {
                bloomPass.strength = stateTimer * 2.2;
                if (stateTimer > 0.8) {
                    cycleState = -1;
                    stateTimer = 0;
                }
            } else if (cycleState === -1) {
                if (stateTimer < 0.6) {
                    bloomPass.strength = 3.8 * (1.0 - stateTimer / 0.6) + 1.6 * (stateTimer / 0.6);
                } else {
                    bloomPass.strength = 1.6;
                }
                if (stateTimer > 2.2) {
                    cycleState = 0;
                    stateTimer = 0;
                    rotationAngle = 0;
                }
            } else if (cycleState === 0) {
                bloomPass.strength = 1.6;
                rotationAngle += delta * 0.75;
                if (rotationAngle >= Math.PI * 2) {
                    cycleState = 1;
                    stateTimer = 0;
                    generateNewExplosionMode(); // 🚀 สุ่มรูปแบบการระเบิดใหม่ก่อนเริ่มระเบิดซ้ำ
                }
            } else if (cycleState === 1) {
                if (stateTimer < 0.5) {
                    bloomPass.strength = 3.5 * (1.0 - stateTimer / 0.5) + 1.6 * (stateTimer / 0.5);
                } else {
                    bloomPass.strength = 1.6;
                }
                if (stateTimer > 2.2) {
                    cycleState = 0;
                    rotationAngle = 0;
                    stateTimer = 0;
                }
            }

            // 💓 REALISTIC ANATOMICAL HEARTBEAT
            let pulse = 0;
            if (cycleState === 0) {
                const bpmCycle = (elapsedTime * 1.25) % 1.0;
                if (bpmCycle < 0.1) {
                    pulse = Math.sin((bpmCycle / 0.1) * Math.PI) * 0.085;
                } else if (bpmCycle >= 0.12 && bpmCycle < 0.22) {
                    pulse = Math.sin(((bpmCycle - 0.12) / 0.1) * Math.PI) * 0.04;
                } else {
                    pulse = 0;
                }
            }

            // 🌊 UPDATE PARTICLES
            for (let i = 0; i < particleCount; i++) {
                const p = particlesData[i];

                if (cycleState === -2) {
                    p.cx = p.sx + (Math.random() - 0.5) * 0.08;
                    p.cy = p.sy + (Math.random() - 0.5) * 0.08;
                    p.cz = p.sz + (Math.random() - 0.5) * 0.08;
                } 
                else if (cycleState === -1) {
                    if (stateTimer < 0.6) {
                        const progress = easeOutCubic(stateTimer / 0.6);
                        p.cx = p.sx + (p.ex - p.sx) * progress;
                        p.cy = p.sy + (p.ey - p.sy) * progress;
                        p.cz = p.sz + (p.ez - p.sz) * progress;
                    } else {
                        const progress = easeOutCubic((stateTimer - 0.6) / 1.6);
                        p.cx += (p.tx - p.cx) * (0.05 + progress * 0.05);
                        p.cy += (p.ty - p.cy) * (0.05 + progress * 0.05);
                        p.cz += (p.tz - p.cz) * (0.05 + progress * 0.05);
                    }
                } 
                else if (cycleState === 1) {
                    if (stateTimer < 0.5) {
                        const progress = easeOutCubic(stateTimer / 0.5);
                        p.cx = p.tx + (p.ex - p.tx) * progress;
                        p.cy = p.ty + (p.ey - p.ty) * progress;
                        p.cz = p.tz + (p.ez - p.tz) * progress;
                    } else {
                        const progress = easeOutCubic((stateTimer - 0.5) / 1.7);
                        p.cx += (p.tx - p.cx) * (0.05 + progress * 0.05);
                        p.cy += (p.ty - p.cy) * (0.05 + progress * 0.05);
                        p.cz += (p.tz - p.cz) * (0.05 + progress * 0.05);
                    }
                } 
                else {
                    if (p.isStream) {
                        p.cy -= p.fallSpeed;
                        const angle = elapsedTime * p.swirlSpeed * 6 + p.phaseX;
                        const radius = 0.025 * (1.0 + (p.ty - p.cy) * 0.25);

                        p.cx += Math.cos(angle) * radius;
                        p.cz += Math.sin(angle) * radius;

                        if (p.cy < -6.8) {
                            p.cx = p.tx;
                            p.cy = p.ty;
                            p.cz = p.tz;
                        }
                    } else {
                        const amp = p.isTop ? 0.18 : 0.06;
                        
                        const fluidX = Math.sin(elapsedTime * 1.2 + p.phaseX) * amp + Math.cos(elapsedTime * 2.1 + p.phaseY) * (amp * 0.5);
                        const fluidY = Math.cos(elapsedTime * 1.1 + p.phaseY) * amp + Math.sin(elapsedTime * 1.8 + p.phaseZ) * (amp * 0.6);
                        const fluidZ = Math.sin(elapsedTime * 1.4 + p.phaseZ) * amp;

                        const upwardDrift = p.isTop ? Math.sin(elapsedTime * 0.8 + p.phaseY) * 0.08 : 0;

                        p.cx = p.tx + fluidX;
                        p.cy = p.ty + fluidY + upwardDrift;
                        p.cz = p.tz + fluidZ;
                    }
                }

                posAttr.setXYZ(i, p.cx, p.cy, p.cz);

                let baseColor = colorCyan.clone().lerp(colorBlue, p.distFromCenter);
                if (p.distFromCenter < 0.28) {
                    baseColor.lerp(colorWhite, 0.65);
                } else if (p.distFromCenter > 0.82) {
                    baseColor.lerp(colorDeepPurple, 0.45);
                }

                colAttr.setXYZ(i, baseColor.r, baseColor.g, baseColor.b);
            }

            posAttr.needsUpdate = true;
            colAttr.needsUpdate = true;

            if (cycleState === 0) {
                floorMat.opacity = Math.min(0.85, floorMat.opacity + delta * 0.8);
            } else {
                floorMat.opacity = Math.max(0.15, floorMat.opacity - delta * 1.5);
            }

            const targetRotX = -mouseY * 0.35;
            const targetRotY = rotationAngle + mouseX * 0.5;

            heartGroup.rotation.y += (targetRotY - heartGroup.rotation.y) * 0.08;
            heartGroup.rotation.x += (targetRotX - heartGroup.rotation.x) * 0.08;

            const beatScale = 1 + pulse;
            heartGroup.scale.set(beatScale, beatScale, beatScale);

            const floorPulse = 1 + pulse * 2.5;
            floorMesh.scale.set(floorPulse, floorPulse, floorPulse);

            composer.render();
        }

        animate();

        // --- 7. RESIZE LISTENER ---
        window.addEventListener('resize', () => {
            updateResponsiveCamera();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
