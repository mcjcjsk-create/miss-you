<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>i love tan - Glowing Flower</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #080105;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            overflow: hidden;
            touch-action: manipulation;
        }
        .container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
            max-width: 500px;
        }
        canvas {
            background-color: #080105;
            width: 100vw;
            height: 100vw;
            max-width: 450px;
            max-height: 450px;
            touch-action: none;
        }
        .controls {
            margin-top: 20px;
            z-index: 10;
        }
        button {
            background: linear-gradient(135deg, #ff4d94, #c72b6b);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            font-size: 15px;
            box-shadow: 0 0 20px rgba(255, 77, 148, 0.5);
            transition: all 0.2s ease;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }
        button:active {
            transform: scale(0.95);
            opacity: 0.9;
        }
    </style>
</head>
<body>

<div class="container">
    <canvas id="flowerCanvas" width="800" height="800"></canvas>
    <div class="controls">
        <button onclick="startAnimation()">🌹 วาดใหม่อีกครั้ง</button>
    </div>
</div>

<script>
const canvas = document.getElementById('flowerCanvas');
const ctx = canvas.getContext('2d');

const WORD = "i love tan";
const FONT = "bold 9px Arial";

let drawQueue = [];
let particles = []; // ละอองหัวใจวิ้งๆ ตามนิ้วมือ
let fireworks = []; // พลุฉลองตอนวาดเสร็จ
let animationFrameId = null;

// ระบบละอองหัวใจตามรอยนิ้ว/เมาส์ (Touch Cursor Trail)
function addParticle(x, y) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    
    const canvasX = (x - rect.left) * scaleX;
    const canvasY = (y - rect.top) * scaleY;

    for (let i = 0; i < 3; i++) {
        particles.push({
            x: canvasX,
            y: canvasY,
            size: Math.random() * 12 + 8,
            vx: (Math.random() - 0.5) * 3,
            vy: (Math.random() - 0.5) * 3 - 1,
            alpha: 1,
            color: `hsl(${Math.random() * 40 + 330}, 100%, 75%)`
        });
    }
}

window.addEventListener('pointermove', (e) => addParticle(e.clientX, e.clientY));
window.addEventListener('pointerdown', (e) => addParticle(e.clientX, e.clientY));

function generatePetalPoints(base, baseAngle, length, width, color, points = 20) {
    const bx = base[0];
    const by = base[1];
    const cosA = Math.cos(baseAngle);
    const sinA = Math.sin(baseAngle);

    for (let i = 0; i <= points; i++) {
        const theta = Math.PI * i / points;
        const out = length * Math.sin(theta);
        const side = width * Math.sin(theta) * Math.cos(theta);

        const rx = out * cosA - side * sinA;
        const ry = out * sinA + side * cosA;

        const px = 400 + (bx + rx);
        const py = 400 - (by + ry);

        drawQueue.push({
            type: 'text',
            text: WORD,
            x: px,
            y: py,
            color: color,
            font: FONT
        });
    }
}

function generateLeafPoints(base, angleDeg, length, width) {
    generatePetalPoints(base, angleDeg * Math.PI / 180, length, width, "#32d768", 20);
}

// ไล่ระดับสีสดใส (Gradient Layer)
const rings = [
    { radius: 0, count: 4, length: 40, width: 15, color: "#ffb3d9", offset: 45 },
    { radius: 10, count: 5, length: 60, width: 20, color: "#ff66b2", offset: 0 },
    { radius: 20, count: 6, length: 75, width: 25, color: "#ff3399", offset: 30 },
    { radius: 30, count: 7, length: 90, width: 30, color: "#e60073", offset: 15 },
    { radius: 40, count: 8, length: 105, width: 35, color: "#b30059", offset: 0 },
    { radius: 50, count: 12, length: 120, width: 40, color: "#800040", offset: 0 },
];

function buildDrawingSequence() {
    drawQueue = [];
    let currentPos = [0, -90];
    let currentHeading = 260;

    function addStemCircle(radius, angleDeg, color) {
        const steps = 30;
        const stepAngle = (angleDeg * Math.PI / 180) / steps;
        let radHeading = currentHeading * Math.PI / 180;

        for (let i = 0; i < steps; i++) {
            const startX = 400 + currentPos[0];
            const startY = 400 - currentPos[1];

            radHeading += stepAngle;
            const stepDist = (2 * Math.PI * radius * (angleDeg / 360)) / steps;
            currentPos[0] += stepDist * Math.cos(radHeading);
            currentPos[1] += stepDist * Math.sin(radHeading);

            const endX = 400 + currentPos[0];
            const endY = 400 - currentPos[1];

            drawQueue.push({
                type: 'line',
                x1: startX,
                y1: startY,
                x2: endX,
                y2: endY,
                color: color,
                width: 3.5
            });
        }
        currentHeading += angleDeg;
    }

    // ก้านและใบ
    addStemCircle(250, 25, "#1f8a4c");
    let pos1 = [...currentPos], head1 = currentHeading;
    generateLeafPoints(pos1, head1 + 50, 50, 25);

    addStemCircle(250, 25, "#1f8a4c");
    let pos2 = [...currentPos], head2 = currentHeading;
    generateLeafPoints(pos2, head2 - 50, 55, 28);

    addStemCircle(250, 30, "#1f8a4c");
    let pos3 = [...currentPos], head3 = currentHeading;
    generateLeafPoints(pos3, head3 + 45, 50, 25);

    addStemCircle(250, 10, "#1f8a4c");

    // กลีบดอก
    rings.forEach(ring => {
        for (let i = 0; i < ring.count; i++) {
            const angle = (360 / ring.count) * i + ring.offset;
            const radAngle = angle * Math.PI / 180;
            const bx = ring.radius * Math.cos(radAngle);
            const by = ring.radius * Math.sin(radAngle);

            generatePetalPoints([bx, by], radAngle, ring.length, ring.width, ring.color);
        }
    });

    // ดาววิ้งๆ รอบข้าง
    for (let i = 0; i < 15; i++) {
        const x = (Math.random() - 0.5) * 520;
        const y = Math.random() * 120 + 140;
        if (Math.hypot(x, y) > 100) {
            drawQueue.push({
                type: 'text',
                text: "✨",
                x: 400 + x,
                y: 400 - y,
                color: "#ffe6f2",
                font: "14px Arial"
            });
        }
    }
}

// สร้างพลุฉลองตอนวาดเสร็จ (Completion Burst)
function triggerCompletionFireworks() {
    for (let i = 0; i < 60; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 6 + 2;
        fireworks.push({
            x: 400,
            y: 400,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            alpha: 1,
            color: `hsl(${Math.random() * 60 + 320}, 100%, 70%)`,
            size: Math.random() * 6 + 3
        });
    }
}

function startAnimation() {
    if (animationFrameId) {
        cancelAnimationFrame(animationFrameId);
    }
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    buildDrawingSequence();
    fireworks = [];

    let index = 0;
    let frameCount = 0;
    const DELAY_FRAMES = 2; // วาดช้าๆ นุ่มนวล

    function animate() {
        frameCount++;

        // ปรับเอฟเฟกต์แสงนีออนละมุน (Glow)
        ctx.shadowBlur = 10;
        ctx.shadowColor = "rgba(255, 105, 180, 0.6)";

        if (frameCount % DELAY_FRAMES === 0 && index < drawQueue.length) {
            const item = drawQueue[index];
            
            if (item.type === 'line') {
                ctx.strokeStyle = item.color;
                ctx.lineWidth = item.width;
                ctx.beginPath();
                ctx.moveTo(item.x1, item.y1);
                ctx.lineTo(item.x2, item.y2);
                ctx.stroke();
            } else if (item.type === 'text') {
                ctx.fillStyle = item.color;
                ctx.font = item.font;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(item.text, item.x, item.y);
            }

            index++;
            if (index === drawQueue.length) {
                triggerCompletionFireworks();
            }
        }

        // วาดเอฟเฟกต์ละอองหัวใจรอยนิ้วมือ
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.alpha;
            ctx.font = `${p.size}px Arial`;
            ctx.fillText("💖", p.x, p.y);

            p.x += p.vx;
            p.y += p.vy;
            p.alpha -= 0.02;

            if (p.alpha <= 0) particles.splice(i, 1);
        }

        // วาดพลุฉลองตอนเสร็จ
        for (let i = fireworks.length - 1; i >= 0; i--) {
            let f = fireworks[i];
            ctx.fillStyle = f.color;
            ctx.globalAlpha = f.alpha;
            ctx.beginPath();
            ctx.arc(f.x, f.y, f.size, 0, Math.PI * 2);
            ctx.fill();

            f.x += f.vx;
            f.y += f.vy;
            f.alpha -= 0.015;

            if (f.alpha <= 0) fireworks.splice(i, 1);
        }

        ctx.globalAlpha = 1;

        if (index < drawQueue.length || particles.length > 0 || fireworks.length > 0) {
            animationFrameId = requestAnimationFrame(animate);
        }

        if (index >= drawQueue.length) {
            ctx.fillStyle = "#ffffff";
            ctx.font = "italic bold 18px Arial";
            ctx.textAlign = "center";
            ctx.shadowBlur = 15;
            ctx.shadowColor = "#ff66b2";
            ctx.fillText("i love tan 💖", 400, 765);
        }
    }

    animate();
}

startAnimation();
</script>

</body>
</html>
