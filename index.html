<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>i love tan - Original Style HD</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            background-color: #0d0208;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            touch-action: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100dvh;
            background-color: #0d0208;
            touch-action: none;
            will-change: transform;
            transform: translateZ(0);
        }
    </style>
</head>
<body>

<canvas id="flowerCanvas"></canvas>

<script>
const canvas = document.getElementById('flowerCanvas');
const ctx = canvas.getContext('2d', { alpha: false });

const staticCanvas = document.createElement('canvas');
const staticCtx = staticCanvas.getContext('2d');

const WORD = "i love tan";
let dpr = window.devicePixelRatio || 1;
let FONT = `bold ${Math.round(10 * dpr)}px Arial`;

let drawQueue = [];
let particles = [];
let fireworks = [];
let animationFrameId = null;

function resizeCanvas() {
    dpr = window.devicePixelRatio || 1;
    const width = window.innerWidth;
    const height = window.innerHeight;

    canvas.width = width * dpr;
    canvas.height = height * dpr;
    staticCanvas.width = width * dpr;
    staticCanvas.height = height * dpr;

    FONT = `bold ${Math.round(10 * dpr)}px Arial`;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

let scale = 1;
let initialPinchDistance = null;

function addParticle(x, y) {
    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;

    const canvasX = (x * dpr - centerX) / scale + centerX;
    const canvasY = (y * dpr - centerY) / scale + centerY;

    particles.push({
        x: canvasX,
        y: canvasY,
        size: 14 * dpr,
        vx: (Math.random() - 0.5) * 1.5 * dpr,
        vy: -1 * dpr,
        alpha: 1,
        color: `hsl(${Math.random() * 30 + 330}, 100%, 75%)`
    });
}

canvas.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) {
        addParticle(e.touches[0].clientX, e.touches[0].clientY);
    } else if (e.touches.length === 2) {
        initialPinchDistance = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
        );
    }
}, { passive: true });

canvas.addEventListener('touchmove', (e) => {
    if (e.touches.length === 1) {
        addParticle(e.touches[0].clientX, e.touches[0].clientY);
    } else if (e.touches.length === 2 && initialPinchDistance) {
        const currentDistance = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
        );
        const factor = currentDistance / initialPinchDistance;
        scale = Math.min(Math.max(0.7, scale * factor), 4);
        initialPinchDistance = currentDistance;
    }
}, { passive: true });

canvas.addEventListener('touchend', () => {
    initialPinchDistance = null;
});

canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
    scale = Math.min(Math.max(0.7, scale * zoomFactor), 4);
}, { passive: false });

// ฟังก์ชันสร้างกลีบดอกและใบตามสูตรคณิตศาสตร์ดั้งเดิมในคลิป
function generatePetalPoints(base, baseAngle, length, width, color, points = 20) {
    const bx = base[0];
    const by = base[1];
    const cosA = Math.cos(baseAngle);
    const sinA = Math.sin(baseAngle);

    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;

    for (let i = 0; i <= points; i++) {
        const theta = Math.PI * i / points;
        const out = length * Math.sin(theta);
        const side = width * Math.sin(theta) * Math.cos(theta);

        const rx = out * cosA - side * sinA;
        const ry = out * sinA + side * cosA;

        drawQueue.push({
            type: 'text',
            text: WORD,
            x: centerX + (bx + rx),
            y: centerY - (by + ry),
            color: color
        });
    }
}

function generateLeafPoints(base, angleRad, length, width) {
    generatePetalPoints(base, angleRad, length, width, "#2aab57", 20);
}

// สเกลขนาดพอดีกับหน้าจอมือถือ
const baseScale = (Math.min(window.innerWidth, window.innerHeight) / 500) * dpr;

const rings = [
    { radius: 0 * baseScale, count: 4, length: 40 * baseScale, width: 15 * baseScale, color: "#f8a3c7", offset: 45 },
    { radius: 10 * baseScale, count: 5, length: 60 * baseScale, width: 20 * baseScale, color: "#f271a9", offset: 0 },
    { radius: 20 * baseScale, count: 6, length: 75 * baseScale, width: 25 * baseScale, color: "#e24888", offset: 30 },
    { radius: 30 * baseScale, count: 7, length: 90 * baseScale, width: 30 * baseScale, color: "#c72b6b", offset: 15 },
    { radius: 40 * baseScale, count: 8, length: 105 * baseScale, width: 35 * baseScale, color: "#9d1f52", offset: 0 },
    { radius: 50 * baseScale, count: 12, length: 120 * baseScale, width: 40 * baseScale, color: "#7c1941", offset: 0 },
];

function buildDrawingSequence() {
    drawQueue = [];
    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;

    // จำลองระบบ Turtle Graphics ลำดับตรงตามในวิดีโอ 100%
    let currentPos = [0, -90 * baseScale];
    let currentHeading = 260; // องศา

    function addStemArc(radius, extentDeg, color) {
        const steps = 25;
        const stepAngle = (extentDeg * Math.PI / 180) / steps;
        let radHeading = currentHeading * Math.PI / 180;

        for (let i = 0; i < steps; i++) {
            const startX = centerX + currentPos[0];
            const startY = centerY - currentPos[1];

            radHeading += stepAngle;
            const stepDist = (2 * Math.PI * radius * (extentDeg / 360)) / steps;
            currentPos[0] += stepDist * Math.cos(radHeading);
            currentPos[1] += stepDist * Math.sin(radHeading);

            drawQueue.push({
                type: 'line',
                x1: startX,
                y1: startY,
                x2: centerX + currentPos[0],
                y2: centerY - currentPos[1],
                color: color,
                width: 3.5 * baseScale
            });
        }
        currentHeading += extentDeg;
    }

    // 1. วาดก้านและใบทีละท่อน ตามลำดับในคลิป
    addStemArc(250 * baseScale, 25, "#1a5b32");
    let pos1 = [...currentPos], head1 = currentHeading;
    generateLeafPoints(pos1, (head1 + 50) * Math.PI / 180, 50 * baseScale, 25 * baseScale);

    addStemArc(250 * baseScale, 25, "#1a5b32");
    let pos2 = [...currentPos], head2 = currentHeading;
    generateLeafPoints(pos2, (head2 - 50) * Math.PI / 180, 55 * baseScale, 28 * baseScale);

    addStemArc(250 * baseScale, 30, "#1a5b32");
    let pos3 = [...currentPos], head3 = currentHeading;
    generateLeafPoints(pos3, (head3 + 45) * Math.PI / 180, 50 * baseScale, 25 * baseScale);

    addStemArc(250 * baseScale, 10, "#1a5b32");

    // 2. วาดดอกไม้ตรงกลาง
    rings.forEach(ring => {
        for (let i = 0; i < ring.count; i++) {
            const angle = (360 / ring.count) * i + ring.offset;
            const radAngle = angle * Math.PI / 180;
            const bx = ring.radius * Math.cos(radAngle);
            const by = ring.radius * Math.sin(radAngle);

            generatePetalPoints([bx, by], radAngle, ring.length, ring.width, ring.color);
        }
    });

    // 3. ละอองดาววิ้งๆ
    for (let i = 0; i < 12; i++) {
        const x = (Math.random() - 0.5) * canvas.width * 0.7;
        const y = Math.random() * canvas.height * 0.3 + canvas.height * 0.1;
        if (Math.hypot(x, y) > 100) {
            drawQueue.push({
                type: 'text',
                text: "*",
                x: centerX + x,
                y: y,
                color: "#f7d9ec"
            });
        }
    }
}

function triggerCompletionFireworks() {
    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;

    for (let i = 0; i < 50; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = (Math.random() * 6 + 2) * dpr;
        fireworks.push({
            x: centerX,
            y: centerY,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            alpha: 1,
            color: `hsl(${Math.random() * 60 + 320}, 100%, 70%)`,
            size: (Math.random() * 5 + 2) * dpr
        });
    }
}

function startAnimation() {
    if (animationFrameId) {
        cancelAnimationFrame(animationFrameId);
    }
    resizeCanvas();
    buildDrawingSequence();
    fireworks = [];
    particles = [];

    staticCtx.fillStyle = "#0d0208";
    staticCtx.fillRect(0, 0, staticCanvas.width, staticCanvas.height);

    let index = 0;
    let frameCount = 0;
    const DRAW_DELAY_FRAMES = 2; // ความเร็วพอดีๆ กำลังโรแมนติก

    function animate() {
        frameCount++;

        if (frameCount % DRAW_DELAY_FRAMES === 0 && index < drawQueue.length) {
            const item = drawQueue[index];
            if (item.type === 'line') {
                staticCtx.strokeStyle = item.color;
                staticCtx.lineWidth = item.width;
                staticCtx.lineCap = "round";
                staticCtx.beginPath();
                staticCtx.moveTo(item.x1, item.y1);
                staticCtx.lineTo(item.x2, item.y2);
                staticCtx.stroke();
            } else if (item.type === 'text') {
                staticCtx.fillStyle = item.color;
                staticCtx.font = FONT;
                staticCtx.textAlign = "center";
                staticCtx.textBaseline = "middle";
                staticCtx.fillText(item.text, item.x, item.y);
            }
            index++;
            if (index === drawQueue.length) {
                triggerCompletionFireworks();
            }
        }

        ctx.fillStyle = "#0d0208";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;

        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.scale(scale, scale);
        ctx.translate(-centerX, -centerY);

        ctx.drawImage(staticCanvas, 0, 0);

        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.alpha;
            ctx.font = `${p.size}px Arial`;
            ctx.fillText("💖", p.x, p.y);

            p.x += p.vx;
            p.y += p.vy;
            p.alpha -= 0.08;

            if (p.alpha <= 0) particles.splice(i, 1);
        }

        for (let i = fireworks.length - 1; i >= 0; i--) {
            let f = fireworks[i];
            ctx.fillStyle = f.color;
            ctx.globalAlpha = f.alpha;
            ctx.beginPath();
            ctx.arc(f.x, f.y, f.size, 0, Math.PI * 2);
            ctx.fill();

            f.x += f.vx;
            f.y += f.vy;
            f.alpha -= 0.03;

            if (f.alpha <= 0) fireworks.splice(i, 1);
        }

        ctx.globalAlpha = 1;
        ctx.restore();

        animationFrameId = requestAnimationFrame(animate);
    }

    animate();
}

startAnimation();
</script>

</body>
</html>
