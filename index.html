<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heart Animation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: radial-gradient(circle at center, #1a1a2e 0%, #0f0f1b 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
    }

    .title {
      margin-bottom: 30px;
      font-size: 2rem;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(255, 46, 99, 0.6);
    }

    /* กล่องสำหรับจัดวางหัวใจ */
    .heart-wrapper {
      position: relative;
      cursor: pointer;
      user-select: none;
      width: 150px;
      height: 150px;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: pulse 1.2s infinite ease-in-out;
    }

    /* รูปหัวใจ SVG */
    .heart-svg {
      width: 100%;
      height: 100%;
      fill: #ff2e63;
      filter: drop-shadow(0 0 25px rgba(255, 46, 99, 0.8));
      transition: transform 0.2s ease;
    }

    .heart-wrapper:hover .heart-svg {
      transform: scale(1.1);
    }

    .instruction {
      margin-top: 40px;
      font-size: 0.95rem;
      opacity: 0.8;
      animation: float 3s ease-in-out infinite;
    }

    /* จังหวะการเต้นของหัวใจ */
    @keyframes pulse {
      0% { transform: scale(1); }
      14% { transform: scale(1.2); }
      28% { transform: scale(1); }
      42% { transform: scale(1.1); }
      70% { transform: scale(1); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
  </style>
</head>
<body>

  <h1 class="title">Heart Animation</h1>

  <div class="heart-wrapper" id="heartBtn">
    <svg class="heart-svg" viewBox="0 0 32 32">
      <path d="M16 28.5C15.4 28.5 14.8 28.2 14.4 27.8L4.6 17.8C1.4 14.5 1.4 9.2 4.6 5.9C7.8 2.6 13 2.6 16.2 5.9L16 6.1L15.8 5.9C19 2.6 24.2 2.6 27.4 5.9C30.6 9.2 30.6 14.5 27.4 17.8L17.6 27.8C17.2 28.2 16.6 28.5 16 28.5Z"/>
    </svg>
  </div>

  <p class="instruction">💡 คลิกที่รูปหัวใจเพื่อปล่อยประกายดาว</p>

  <script>
    const heartBtn = document.getElementById('heartBtn');

    heartBtn.addEventListener('click', (e) => {
      const rect = heartBtn.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;

      for (let i = 0; i < 20; i++) {
        createParticle(centerX, centerY);
      }
    });

    function createParticle(x, y) {
      const particle = document.createElement('div');
      document.body.appendChild(particle);

      const size = Math.random() * 12 + 6;
      const colors = ['#ff2e63', '#ff7597', '#ffffff', '#ffb3c6'];
      const color = colors[Math.floor(Math.random() * colors.length)];

      particle.style.width = size + 'px';
      particle.style.height = size + 'px';
      particle.style.backgroundColor = color;
      particle.style.borderRadius = '50%';
      particle.style.position = 'fixed';
      particle.style.left = x + 'px';
      particle.style.top = y + 'px';
      particle.style.pointerEvents = 'none';
      particle.style.boxShadow = `0 0 10px ${color}`;

      const angle = Math.random() * Math.PI * 2;
      const dist = Math.random() * 120 + 40;
      const destX = Math.cos(angle) * dist;
      const destY = Math.sin(angle) * dist;

      const anim = particle.animate([
        { transform: 'translate(-50%, -50%) scale(1)', opacity: 1 },
        { transform: `translate(calc(-50% + ${destX}px), calc(-50% + ${destY}px)) scale(0)`, opacity: 0 }
      ], {
        duration: 800 + Math.random() * 400,
        easing: 'ease-out'
      });

      anim.onfinish = () => particle.remove();
    }
  </script>
</body>
</html>
