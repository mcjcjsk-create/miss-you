<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>i love tan - Perfect Flower</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            background-color: #080105;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            touch-action: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100dvh;
            background-color: #080105;
            touch-action: none;
            will-change: transform;
            transform: translateZ(0);
        }
    </style>
</head>
<body>

<canvas id="flowerCanvas"></canvas>

<script>
const canvas = document.getElementById('flowerCanvas');
const ctx = canvas.getContext('2d', { alpha: false });

const staticCanvas = document.createElement('canvas');
const staticCtx = staticCanvas.getContext('2d');

const WORD = "i love tan";
let dpr = window.devicePixelRatio || 1;
let FONT = `bold ${Math.round(13 * dpr)}px Arial`;

let drawQueue = [];
let particles = [];
let fireworks = [];
let animationFrameId = null;

function resizeCanvas() {
    dpr = window.devicePixelRatio || 1;
    const width = window.innerWidth;
    const height = window.innerHeight;

    canvas.width = width * dpr;
    canvas.height = height * dpr;
    staticCanvas.width = width * dpr;
    staticCanvas.height = height * dpr;

    FONT = `bold ${Math.round(13 * dpr)}px Arial`;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

let scale = 1;
let initialPinchDistance = null;

function addParticle(x, y) {
    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;

    const canvasX = (x * dpr - centerX) / scale + centerX;
    const canvasY = (y * dpr - centerY) / scale + centerY;

    particles.push({
        x: canvasX,
        y: canvasY,
        size: 14 * dpr,
        vx: (Math.random() - 0.5) * 1.5 * dpr,
        vy: -1 * dpr,
        alpha: 1,
        color: `hsl(${Math.random() * 30 + 330}, 100%, 75%)`
    });
}

canvas.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) {
        addParticle(e.touches[0].clientX, e.touches[0].clientY);
    } else if (e.touches.length === 2) {
        initialPinchDistance = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
        );
    }
}, { passive: true });

canvas.addEventListener('touchmove', (e) => {
    if (e.touches.length === 1) {
        addParticle(e.touches[0].clientX, e.touches[0].clientY);
    } else if (e.touches.length === 2 && initialPinchDistance) {
        const currentDistance = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
        );
        const factor = currentDistance / initialPinchDistance;
        scale = Math.min(Math.max(0.7, scale * factor), 4);
        initialPinchDistance = currentDistance;
    }
}, { passive: true });

canvas.addEventListener('touchend', () => {
    initialPinchDistance = null;
});

canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
    scale = Math.min(Math.max(0.7, scale * zoomFactor), 4);
}, { passive: false });

function generatePetalPoints(base, baseAngle, length, width, color, points = 20) {
    const bx = base[0];
    const by = base[1];
    const cosA = Math.cos(baseAngle);
    const sinA = Math.sin(baseAngle);

    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2 - 60 * baseScale; // เลื่อนดอกไม้ขึ้นบนเล็กน้อยให้สมดุล

    for (let i = 0; i <= points; i++) {
        const theta = Math.PI * i / points;
        const out = length * Math.sin(theta);
        const side = width * Math.sin(theta) * Math.cos(theta);

        const rx = out * cosA - side * sinA;
        const ry = out * sinA + side * cosA;

        drawQueue.push({
            type: 'text',
            text: WORD,
            x: centerX + (bx + rx),
            y: centerY - (by + ry),
            color: color
        });
    }
}

function generateLeafPoints(base, angleDeg, length, width) {
    generatePetalPoints(base, angleDeg * Math.PI / 180, length, width, "#32d768", 20);
}

const baseScale = (Math.min(window.innerWidth, window.innerHeight) / 450) * dpr;

const rings = [
    { radius: 0 * baseScale, count: 4, length: 60 * baseScale, width: 22 * baseScale, color: "#ffb3d9", offset: 45 },
    { radius: 15 * baseScale, count: 5, length: 85 * baseScale, width: 30 * baseScale, color: "#ff66b2", offset: 0 },
    { radius: 30 * baseScale, count: 6, length: 110 * baseScale, width: 38 * baseScale, color: "#ff3399", offset: 30 },
    { radius: 45 * baseScale, count: 7, length: 135 * baseScale, width: 46 * baseScale, color: "#e60073", offset: 15 },
    { radius: 60 * baseScale, count: 8, length: 160 * baseScale, width: 54 * baseScale, color: "#b30059", offset: 0 },
    { radius: 75 * baseScale, count: 12, length: 185 * baseScale, width: 62 * baseScale, color: "#800040", offset: 0 },
];

function buildDrawingSequence() {
    drawQueue = [];
    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2 - 60 * baseScale;

    // --- 1. วาดก้านต่อจากขอบล่างดอกไม้ (startY = 70 * baseScale เพื่อไม่ให้ทับดอก) ---
    let stemPoints = [];
    let startY = 65 * baseScale; // ย้ายจุดเริ่มต้นโคนก้านลงใต้ดอกไม้
    let endY = 320 * baseScale;
    let steps = 80;

    for (let i = 0; i <= steps; i++) {
        let t = i / steps;
        let currY = startY + t * (endY - startY);
        let currX = Math.sin(t * Math.PI) * (-35 * baseScale);

        stemPoints.push({
            x: centerX + currX,
            y: centerY + currY
        });
    }

    for (let i = 0; i < stemPoints.length - 1; i++) {
        drawQueue.push({
            type: 'line',
            x1: stemPoints[i].x,
            y1: stemPoints[i].y,
            x2: stemPoints[i + 1].x,
            y2: stemPoints[i + 1].y,
            color: "#1f8a4c",
            width: 4.5 * baseScale
        });

        // ใบไม้เริ่มจากใต้ดอกไม้เป็นต้นไป
        if (i === Math.floor(steps * 0.2)) {
            let leafBase = [stemPoints[i].x - centerX, centerY - stemPoints[i].y];
            generateLeafPoints(leafBase, 210, 70 * baseScale, 35 * baseScale);
        } else if (i === Math.floor(steps * 0.55)) {
            let leafBase = [stemPoints[i].x - centerX, centerY - stemPoints[i].y];
            generateLeafPoints(leafBase, -30, 75 * baseScale, 38 * baseScale);
        } else if (i === Math.floor(steps * 0.85)) {
            let leafBase = [stemPoints[i].x - centerX, centerY - stemPoints[i].y];
            generateLeafPoints(leafBase, 215, 70 * baseScale, 35 * baseScale);
        }
    }

    // --- 2. วาดดอกไม้ทับก้าน (เรียงลำดับมาทีหลัง ก้านจะไม่ทับดอกเด็ดขาด) ---
    rings.forEach(ring => {
        for (let i = 0; i < ring.count; i++) {
            const angle = (360 / ring.count) * i + ring.offset;
            const radAngle = angle * Math.PI / 180;
            const bx = ring.radius * Math.cos(radAngle);
            const by = ring.radius * Math.sin(radAngle);

            generatePetalPoints([bx, by], radAngle, ring.length, ring.width, ring.color);
        }
    });

    // --- 3. ละอองดาววิ้งๆ ---
    for (let i = 0; i < 15; i++) {
        const x = (Math.random() - 0.5) * canvas.width * 0.8;
        const y = Math.random() * canvas.height * 0.3 + canvas.height * 0.1;
        if (Math.hypot(x, y) > 100) {
            drawQueue.push({
                type: 'text',
                text: "✨",
                x: centerX + x,
                y: y,
                color: "#ffe6f2"
            });
        }
    }
}

function triggerCompletionFireworks() {
    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2 - 60 * baseScale;

    for (let i = 0; i < 50; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = (Math.random() * 6 + 2) * dpr;
        fireworks.push({
            x: centerX,
            y: centerY,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            alpha: 1,
            color: `hsl(${Math.random() * 60 + 320}, 100%, 70%)`,
            size: (Math.random() * 5 + 2) * dpr
        });
    }
}

function startAnimation() {
    if (animationFrameId) {
        cancelAnimationFrame(animationFrameId);
    }
    resizeCanvas();
    buildDrawingSequence();
    fireworks = [];
    particles = [];

    staticCtx.fillStyle = "#080105";
    staticCtx.fillRect(0, 0, staticCanvas.width, staticCanvas.height);

    let index = 0;
    let frameCount = 0;
    const DRAW_DELAY_FRAMES = 3;

    function animate() {
        frameCount++;

        if (frameCount % DRAW_DELAY_FRAMES === 0 && index < drawQueue.length) {
            const item = drawQueue[index];
            if (item.type === 'line') {
                staticCtx.strokeStyle = item.color;
                staticCtx.lineWidth = item.width;
                staticCtx.lineCap = "round";
                staticCtx.beginPath();
                staticCtx.moveTo(item.x1, item.y1);
                staticCtx.lineTo(item.x2, item.y2);
                staticCtx.stroke();
            } else if (item.type === 'text') {
                staticCtx.fillStyle = item.color;
                staticCtx.font = FONT;
                staticCtx.textAlign = "center";
                staticCtx.textBaseline = "middle";
                staticCtx.fillText(item.text, item.x, item.y);
            }
            index++;
            if (index === drawQueue.length) {
                triggerCompletionFireworks();
            }
        }

        ctx.fillStyle = "#080105";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;

        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.scale(scale, scale);
        ctx.translate(-centerX, -centerY);

        ctx.drawImage(staticCanvas, 0, 0);

        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.alpha;
            ctx.font = `${p.size}px Arial`;
            ctx.fillText("💖", p.x, p.y);

            p.x += p.vx;
            p.y += p.vy;
            p.alpha -= 0.08;

            if (p.alpha <= 0) particles.splice(i, 1);
        }

        for (let i = fireworks.length - 1; i >= 0; i--) {
            let f = fireworks[i];
            ctx.fillStyle = f.color;
            ctx.globalAlpha = f.alpha;
            ctx.beginPath();
            ctx.arc(f.x, f.y, f.size, 0, Math.PI * 2);
            ctx.fill();

            f.x += f.vx;
            f.y += f.vy;
            f.alpha -= 0.03;

            if (f.alpha <= 0) fireworks.splice(i, 1);
        }

        ctx.globalAlpha = 1;
        ctx.restore();

        animationFrameId = requestAnimationFrame(animate);
    }

    animate();
}

startAnimation();
</script>

</body>
</html>
