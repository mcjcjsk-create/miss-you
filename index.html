<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Love Flower</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0d0208;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            background-color: #0d0208;
            box-shadow: 0 0 30px rgba(226, 72, 136, 0.15);
            border-radius: 12px;
        }
        .controls {
            margin-top: 15px;
        }
        button {
            background: #e24888;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.2s ease;
        }
        button:hover {
            background: #f271a9;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

<div class="container">
    <canvas id="flowerCanvas" width="800" height="800"></canvas>
    <div class="controls">
        <button onclick="drawFlower()">วาดใหม่ (Re-draw)</button>
    </div>
</div>

<script>
const canvas = document.getElementById('flowerCanvas');
const ctx = canvas.getContext('2d');

const WORD = "My Love";
const FONT = "bold 9px Arial";

function drawPetal(base, baseAngle, length, width, color, points = 20) {
    ctx.fillStyle = color;
    ctx.font = FONT;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    const bx = base[0];
    const by = base[1];
    const cosA = Math.cos(baseAngle);
    const sinA = Math.sin(baseAngle);

    for (let i = 0; i <= points; i++) {
        const theta = Math.PI * i / points;
        const out = length * Math.sin(theta);
        const side = width * Math.sin(theta) * Math.cos(theta);

        const rx = out * cosA - side * sinA;
        const ry = out * sinA + side * cosA;

        const px = 400 + (bx + rx);
        const py = 400 - (by + ry);

        ctx.fillText(WORD, px, py);
    }
}

function drawLeaf(base, angleDeg, length, width) {
    drawPetal(base, angleDeg * Math.PI / 180, length, width, "#2aab57", 20);
}

const rings = [
    { radius: 0, count: 4, length: 40, width: 15, color: "#f8a3c7", offset: 45 },
    { radius: 10, count: 5, length: 60, width: 20, color: "#f271a9", offset: 0 },
    { radius: 20, count: 6, length: 75, width: 25, color: "#e24888", offset: 30 },
    { radius: 30, count: 7, length: 90, width: 30, color: "#c72b6b", offset: 15 },
    { radius: 40, count: 8, length: 105, width: 35, color: "#9d1f52", offset: 0 },
    { radius: 50, count: 12, length: 120, width: 40, color: "#7c1941", offset: 0 },
];

function drawFlower() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    let currentPos = [0, -90];
    let currentHeading = 260;

    function moveAlongCircle(radius, angleDeg, color, drawStem = true) {
        const steps = 30;
        const stepAngle = (angleDeg * Math.PI / 180) / steps;
        let radHeading = currentHeading * Math.PI / 180;

        if (drawStem) {
            ctx.strokeStyle = color;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(400 + currentPos[0], 400 - currentPos[1]);
        }

        for (let i = 0; i < steps; i++) {
            radHeading += stepAngle;
            const stepDist = (2 * Math.PI * radius * (angleDeg / 360)) / steps;
            currentPos[0] += stepDist * Math.cos(radHeading);
            currentPos[1] += stepDist * Math.sin(radHeading);

            if (drawStem) {
                ctx.lineTo(400 + currentPos[0], 400 - currentPos[1]);
            }
        }
        if (drawStem) {
            ctx.stroke();
        }
        currentHeading += angleDeg;
    }

    // ก้านและใบ
    moveAlongCircle(250, 25, "#1a5b32");
    let pos1 = [...currentPos];
    let head1 = currentHeading;
    drawLeaf(pos1, head1 + 50, 50, 25);

    moveAlongCircle(250, 25, "#1a5b32");
    let pos2 = [...currentPos];
    let head2 = currentHeading;
    drawLeaf(pos2, head2 - 50, 55, 28);

    moveAlongCircle(250, 30, "#1a5b32");
    let pos3 = [...currentPos];
    let head3 = currentHeading;
    drawLeaf(pos3, head3 + 45, 50, 25);

    moveAlongCircle(250, 10, "#1a5b32");

    // กลีบดอกไม้
    rings.forEach(ring => {
        for (let i = 0; i < ring.count; i++) {
            const angle = (360 / ring.count) * i + ring.offset;
            const radAngle = angle * Math.PI / 180;

            const bx = ring.radius * Math.cos(radAngle);
            const by = ring.radius * Math.sin(radAngle);

            drawPetal([bx, by], radAngle, ring.length, ring.width, ring.color);
        }
    });

    // ละอองดาววิ้ง ๆ
    ctx.fillStyle = "#f7d9ec";
    ctx.font = "bold 16px Courier, monospace";
    for (let i = 0; i < 12; i++) {
        const x = (Math.random() - 0.5) * 500;
        const y = Math.random() * 100 + 150;
        if (Math.hypot(x, y) > 100) {
            ctx.fillText("*", 400 + x, 400 - y);
        }
    }

    // ข้อความด้านล่าง
    ctx.fillStyle = "#ffffff";
    ctx.font = "italic 14px Arial";
    ctx.textAlign = "center";
    ctx.fillText("My Love Flower", 400, 760);
}

drawFlower();
</script>

</body>
</html>
