<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>i love tan - Zoomable Flower</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #080105;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            overflow: hidden;
            touch-action: none; /* ป้องกันเบราว์เซอร์เลื่อนหน้าจอเวลาใช้นิ้วซูม */
        }
        .container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
            max-width: 600px;
        }
        canvas {
            background-color: #080105;
            width: 100vw;
            height: 100vw;
            max-width: 550px;
            max-height: 550px;
            touch-action: none;
            cursor: grab;
        }
        canvas:active {
            cursor: grabbing;
        }
        .controls {
            margin-top: 15px;
            z-index: 10;
            display: flex;
            gap: 10px;
        }
        button {
            background: linear-gradient(135deg, #ff4d94, #c72b6b);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 0 15px rgba(255, 77, 148, 0.4);
            transition: all 0.2s ease;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }
        button:active {
            transform: scale(0.95);
            opacity: 0.9;
        }
    </style>
</head>
<body>

<div class="container">
    <canvas id="flowerCanvas" width="800" height="800"></canvas>
    <div class="controls">
        <button onclick="resetZoom()">🔍 รีเซ็ตมุมมอง</button>
        <button onclick="startAnimation()">🌹 วาดใหม่</button>
    </div>
</div>

<script>
const canvas = document.getElementById('flowerCanvas');
const ctx = canvas.getContext('2d');

const WORD = "i love tan";
const FONT = "bold 10px Arial"; // ขยายฟอนต์ขึ้นนิดนึงตามขนาดดอกไม้

let drawQueue = [];
let particles = [];
let fireworks = [];
let animationFrameId = null;

// สถานะการซูมและย้ายมุมมอง (Zoom & Pan)
let scale = 1;
let panX = 0;
let panY = 0;
let isDragging = false;
let startX, startY;
let initialPinchDistance = null;

function resetZoom() {
    scale = 1;
    panX = 0;
    panY = 0;
}

// เอฟเฟกต์หัวใจตามนิ้ว (จางหายเร็วขึ้น)
function addParticle(x, y) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    
    // คำนวณพิกัดจริงตามการซูม
    const canvasX = ((x - rect.left) * scaleX - 400 - panX) / scale + 400;
    const canvasY = ((y - rect.top) * scaleY - 400 - panY) / scale + 400;

    for (let i = 0; i < 2; i++) {
        particles.push({
            x: canvasX,
            y: canvasY,
            size: Math.random() * 12 + 10,
            vx: (Math.random() - 0.5) * 2,
            vy: (Math.random() - 0.5) * 2 - 1,
            alpha: 1, // เริ่มต้นความโปร่งแสงเต็มร้อย
            color: `hsl(${Math.random() * 40 + 330}, 100%, 75%)`
        });
    }
}

// ระบบ Pinch to Zoom และ Pan บนมือถือ
canvas.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) {
        isDragging = true;
        startX = e.touches[0].clientX - panX;
        startY = e.touches[0].clientY - panY;
        addParticle(e.touches[0].clientX, e.touches[0].clientY);
    } else if (e.touches.length === 2) {
        isDragging = false;
        initialPinchDistance = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
        );
    }
});

canvas.addEventListener('touchmove', (e) => {
    if (e.touches.length === 1 && isDragging) {
        panX = e.touches[0].clientX - startX;
        panY = e.touches[0].clientY - startY;
        addParticle(e.touches[0].clientX, e.touches[0].clientY);
    } else if (e.touches.length === 2 && initialPinchDistance) {
        const currentDistance = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
        );
        const factor = currentDistance / initialPinchDistance;
        scale = Math.min(Math.max(0.8, scale * factor), 3); // จำกัดการซูมระหว่าง 0.8x - 3x
        initialPinchDistance = currentDistance;
    }
});

canvas.addEventListener('touchend', () => {
    isDragging = false;
    initialPinchDistance = null;
});

// รองรับ Scroll Wheel บนคอมพิวเตอร์
canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
    scale = Math.min(Math.max(0.8, scale * zoomFactor), 3);
});

function generatePetalPoints(base, baseAngle, length, width, color, points = 22) {
    const bx = base[0];
    const by = base[1];
    const cosA = Math.cos(baseAngle);
    const sinA = Math.sin(baseAngle);

    for (let i = 0; i <= points; i++) {
        const theta = Math.PI * i / points;
        const out = length * Math.sin(theta);
        const side = width * Math.sin(theta) * Math.cos(theta);

        const rx = out * cosA - side * sinA;
        const ry = out * sinA + side * cosA;

        const px = 400 + (bx + rx);
        const py = 400 - (by + ry);

        drawQueue.push({
            type: 'text',
            text: WORD,
            x: px,
            y: py,
            color: color,
            font: FONT
        });
    }
}

function generateLeafPoints(base, angleDeg, length, width) {
    generatePetalPoints(base, angleDeg * Math.PI / 180, length, width, "#32d768", 22);
}

// ขยายขนาดสเกลของกลีบดอกไม้ให้ใหญ่ขึ้น (~30-40%)
const rings = [
    { radius: 0, count: 4, length: 55, width: 20, color: "#ffb3d9", offset: 45 },
    { radius: 15, count: 5, length: 80, width: 28, color: "#ff66b2", offset: 0 },
    { radius: 30, count: 6, length: 105, width: 36, color: "#ff3399", offset: 30 },
    { radius: 45, count: 7, length: 130, width: 44, color: "#e60073", offset: 15 },
    { radius: 60, count: 8, length: 150, width: 50, color: "#b30059", offset: 0 },
    { radius: 75, count: 12, length: 175, width: 58, color: "#800040", offset: 0 },
];

function buildDrawingSequence() {
    drawQueue = [];
    let currentPos = [0, -140]; // ขยับฐานลงมาเพื่อให้ดอกไม้อยู่กึ่งกลางพอดี
    let currentHeading = 260;

    function addStemCircle(radius, angleDeg, color) {
        const steps = 30;
        const stepAngle = (angleDeg * Math.PI / 180) / steps;
        let radHeading = currentHeading * Math.PI / 180;

        for (let i = 0; i < steps; i++) {
            const startX = 400 + currentPos[0];
            const startY = 400 - currentPos[1];

            radHeading += stepAngle;
            const stepDist = (2 * Math.PI * radius * (angleDeg / 360)) / steps;
            currentPos[0] += stepDist * Math.cos(radHeading);
            currentPos[1] += stepDist * Math.sin(radHeading);

            const endX = 400 + currentPos[0];
            const endY = 400 - currentPos[1];

            drawQueue.push({
                type: 'line',
                x1: startX,
                y1: startY,
                x2: endX,
                y2: endY,
                color: color,
                width: 4
            });
        }
        currentHeading += angleDeg;
    }

    // ก้านและใบขยายขนาด
    addStemCircle(300, 25, "#1f8a4c");
    let pos1 = [...currentPos], head1 = currentHeading;
    generateLeafPoints(pos1, head1 + 50, 70, 35);

    addStemCircle(300, 25, "#1f8a4c");
    let pos2 = [...currentPos], head2 = currentHeading;
    generateLeafPoints(pos2, head2 - 50, 75, 38);

    addStemCircle(300, 30, "#1f8a4c");
    let pos3 = [...currentPos], head3 = currentHeading;
    generateLeafPoints(pos3, head3 + 45, 70, 35);

    addStemCircle(300, 10, "#1f8a4c");

    // กลีบดอก
    rings.forEach(ring => {
        for (let i = 0; i < ring.count; i++) {
            const angle = (360 / ring.count) * i + ring.offset;
            const radAngle = angle * Math.PI / 180;
            const bx = ring.radius * Math.cos(radAngle);
            const by = ring.radius * Math.sin(radAngle);

            generatePetalPoints([bx, by], radAngle, ring.length, ring.width, ring.color);
        }
    });

    // ละอองดาววิ้งๆ
    for (let i = 0; i < 15; i++) {
        const x = (Math.random() - 0.5) * 580;
        const y = Math.random() * 160 + 160;
        if (Math.hypot(x, y) > 120) {
            drawQueue.push({
                type: 'text',
                text: "✨",
                x: 400 + x,
                y: 400 - y,
                color: "#ffe6f2",
                font: "16px Arial"
            });
        }
    }
}

function triggerCompletionFireworks() {
    for (let i = 0; i < 70; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 7 + 2;
        fireworks.push({
            x: 400,
            y: 400,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            alpha: 1,
            color: `hsl(${Math.random() * 60 + 320}, 100%, 70%)`,
            size: Math.random() * 6 + 3
        });
    }
}

function startAnimation() {
    if (animationFrameId) {
        cancelAnimationFrame(animationFrameId);
    }
    buildDrawingSequence();
    fireworks = [];

    let index = 0;
    let frameCount = 0;
    const DELAY_FRAMES = 2;

    function animate() {
        frameCount++;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // นำระบบ Zoom & Pan มาประยุกต์ใช้กับ Canvas
        ctx.save();
        ctx.translate(400 + panX, 400 + panY);
        ctx.scale(scale, scale);
        ctx.translate(-400, -400);

        ctx.shadowBlur = 12;
        ctx.shadowColor = "rgba(255, 105, 180, 0.6)";

        // วาดส่วนประกอบดอกไม้ทีละชิ้น
        for (let i = 0; i < index && i < drawQueue.length; i++) {
            const item = drawQueue[i];
            if (item.type === 'line') {
                ctx.strokeStyle = item.color;
                ctx.lineWidth = item.width;
                ctx.beginPath();
                ctx.moveTo(item.x1, item.y1);
                ctx.lineTo(item.x2, item.y2);
                ctx.stroke();
            } else if (item.type === 'text') {
                ctx.fillStyle = item.color;
                ctx.font = item.font;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(item.text, item.x, item.y);
            }
        }

        if (frameCount % DELAY_FRAMES === 0 && index < drawQueue.length) {
            index++;
            if (index === drawQueue.length) {
                triggerCompletionFireworks();
            }
        }

        // เอฟเฟกต์หัวใจตามรอยนิ้ว (ปรับอัตราจาง alpha -= 0.05 ให้สลายเร็วขึ้น)
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.alpha;
            ctx.font = `${p.size}px Arial`;
            ctx.fillText("💖", p.x, p.y);

            p.x += p.vx;
            p.y += p.vy;
            p.alpha -= 0.05; // จางหายไวขึ้น (อยู่นิดเดียวแล้วหายไป)

            if (p.alpha <= 0) particles.splice(i, 1);
        }

        // พลุฉลอง
        for (let i = fireworks.length - 1; i >= 0; i--) {
            let f = fireworks[i];
            ctx.fillStyle = f.color;
            ctx.globalAlpha = f.alpha;
            ctx.beginPath();
            ctx.arc(f.x, f.y, f.size, 0, Math.PI * 2);
            ctx.fill();

            f.x += f.vx;
            f.y += f.vy;
            f.alpha -= 0.02;

            if (f.alpha <= 0) fireworks.splice(i, 1);
        }

        ctx.globalAlpha = 1;

        if (index >= drawQueue.length) {
            ctx.fillStyle = "#ffffff";
            ctx.font = "italic bold 18px Arial";
            ctx.textAlign = "center";
            ctx.shadowBlur = 15;
            ctx.shadowColor = "#ff66b2";
            ctx.fillText("i love tan 💖", 400, 770);
        }

        ctx.restore();

        animationFrameId = requestAnimationFrame(animate);
    }

    animate();
}

startAnimation();
</script>

</body>
</html>
