<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>i love tan - Fullscreen Flower</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #080105;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            touch-action: none; /* ป้องกันการเลื่อนหน้าจอเวลาซูมบนมือถือ */
        }
        /* Canvas ขยายเต็มขอบหน้าจอ 100% ไร้ขอบ */
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background-color: #080105;
            touch-action: none;
            cursor: grab;
        }
        canvas:active {
            cursor: grabbing;
        }
        /* ปุ่มควบคุมแบบลอยอยู่อยู่ด้านบน (Floating Controls) ไม่บดบังดอกไม้ */
        .controls {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 12px;
        }
        button {
            background: linear-gradient(135deg, rgba(255, 77, 148, 0.85), rgba(199, 43, 107, 0.85));
            backdrop-filter: blur(8px);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 22px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            box-shadow: 0 4px 15px rgba(255, 77, 148, 0.3);
            transition: all 0.2s ease;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }
        button:active {
            transform: scale(0.95);
            opacity: 0.9;
        }
    </style>
</head>
<body>

<canvas id="flowerCanvas"></canvas>

<div class="controls">
    <button onclick="resetZoom()">🔍 รีเซ็ตมุมมอง</button>
    <button onclick="startAnimation()">🌹 วาดใหม่</button>
</div>

<script>
const canvas = document.getElementById('flowerCanvas');
const ctx = canvas.getContext('2d');

const WORD = "i love tan";
const FONT = "bold 11px Arial";

let drawQueue = [];
let particles = [];
let fireworks = [];
let animationFrameId = null;

// ปรับขนาด Canvas ตามขนาดหน้าจออัตโนมัติ (Full Window Resize)
function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// สถานะ Zoom & Pan
let scale = 1;
let panX = 0;
let panY = 0;
let isDragging = false;
let startX, startY;
let initialPinchDistance = null;

function resetZoom() {
    scale = 1;
    panX = 0;
    panY = 0;
}

// เอฟเฟกต์หัวใจตามนิ้ว (จางหายไว นุ่มนวล)
function addParticle(x, y) {
    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;

    const canvasX = (x - centerX - panX) / scale + centerX;
    const canvasY = (y - centerY - panY) / scale + centerY;

    for (let i = 0; i < 2; i++) {
        particles.push({
            x: canvasX,
            y: canvasY,
            size: Math.random() * 12 + 10,
            vx: (Math.random() - 0.5) * 2,
            vy: (Math.random() - 0.5) * 2 - 1,
            alpha: 1,
            color: `hsl(${Math.random() * 40 + 330}, 100%, 75%)`
        });
    }
}

// ระบบ Touch Interactivity (Drag & Pinch Zoom)
canvas.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) {
        isDragging = true;
        startX = e.touches[0].clientX - panX;
        startY = e.touches[0].clientY - panY;
        addParticle(e.touches[0].clientX, e.touches[0].clientY);
    } else if (e.touches.length === 2) {
        isDragging = false;
        initialPinchDistance = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
        );
    }
});

canvas.addEventListener('touchmove', (e) => {
    if (e.touches.length === 1 && isDragging) {
        panX = e.touches[0].clientX - startX;
        panY = e.touches[0].clientY - startY;
        addParticle(e.touches[0].clientX, e.touches[0].clientY);
    } else if (e.touches.length === 2 && initialPinchDistance) {
        const currentDistance = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
        );
        const factor = currentDistance / initialPinchDistance;
        scale = Math.min(Math.max(0.7, scale * factor), 3.5);
        initialPinchDistance = currentDistance;
    }
});

canvas.addEventListener('touchend', () => {
    isDragging = false;
    initialPinchDistance = null;
});

canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
    scale = Math.min(Math.max(0.7, scale * zoomFactor), 3.5);
});

function generatePetalPoints(base, baseAngle, length, width, color, points = 22) {
    const bx = base[0];
    const by = base[1];
    const cosA = Math.cos(baseAngle);
    const sinA = Math.sin(baseAngle);

    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;

    for (let i = 0; i <= points; i++) {
        const theta = Math.PI * i / points;
        const out = length * Math.sin(theta);
        const side = width * Math.sin(theta) * Math.cos(theta);

        const rx = out * cosA - side * sinA;
        const ry = out * sinA + side * cosA;

        const px = centerX + (bx + rx);
        const py = centerY - (by + ry);

        drawQueue.push({
            type: 'text',
            text: WORD,
            x: px,
            y: py,
            color: color,
            font: FONT
        });
    }
}

function generateLeafPoints(base, angleDeg, length, width) {
    generatePetalPoints(base, angleDeg * Math.PI / 180, length, width, "#32d768", 22);
}

// ปรับขนาดดอกไม้ให้ขยายใหญ่สุดเต็มหน้าจออัตโนมัติ
const baseScale = Math.min(window.innerWidth, window.innerHeight) / 450;

const rings = [
    { radius: 0 * baseScale, count: 4, length: 60 * baseScale, width: 22 * baseScale, color: "#ffb3d9", offset: 45 },
    { radius: 15 * baseScale, count: 5, length: 85 * baseScale, width: 30 * baseScale, color: "#ff66b2", offset: 0 },
    { radius: 30 * baseScale, count: 6, length: 110 * baseScale, width: 38 * baseScale, color: "#ff3399", offset: 30 },
    { radius: 45 * baseScale, count: 7, length: 135 * baseScale, width: 46 * baseScale, color: "#e60073", offset: 15 },
    { radius: 60 * baseScale, count: 8, length: 160 * baseScale, width: 54 * baseScale, color: "#b30059", offset: 0 },
    { radius: 75 * baseScale, count: 12, length: 185 * baseScale, width: 62 * baseScale, color: "#800040", offset: 0 },
];

function buildDrawingSequence() {
    drawQueue = [];
    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;

    let currentPos = [0, -150 * baseScale];
    let currentHeading = 260;

    function addStemCircle(radius, angleDeg, color) {
        const steps = 30;
        const stepAngle = (angleDeg * Math.PI / 180) / steps;
        let radHeading = currentHeading * Math.PI / 180;

        for (let i = 0; i < steps; i++) {
            const startX = centerX + currentPos[0];
            const startY = centerY - currentPos[1];

            radHeading += stepAngle;
            const stepDist = (2 * Math.PI * radius * (angleDeg / 360)) / steps;
            currentPos[0] += stepDist * Math.cos(radHeading);
            currentPos[1] += stepDist * Math.sin(radHeading);

            const endX = centerX + currentPos[0];
            const endY = centerY - currentPos[1];

            drawQueue.push({
                type: 'line',
                x1: startX,
                y1: startY,
                x2: endX,
                y2: endY,
                color: color,
                width: 4 * baseScale
            });
        }
        currentHeading += angleDeg;
    }

    // ก้านและใบ
    addStemCircle(300 * baseScale, 25, "#1f8a4c");
    let pos1 = [...currentPos], head1 = currentHeading;
    generateLeafPoints(pos1, head1 + 50, 75 * baseScale, 38 * baseScale);

    addStemCircle(300 * baseScale, 25, "#1f8a4c");
    let pos2 = [...currentPos], head2 = currentHeading;
    generateLeafPoints(pos2, head2 - 50, 80 * baseScale, 40 * baseScale);

    addStemCircle(300 * baseScale, 30, "#1f8a4c");
    let pos3 = [...currentPos], head3 = currentHeading;
    generateLeafPoints(pos3, head3 + 45, 75 * baseScale, 38 * baseScale);

    addStemCircle(300 * baseScale, 10, "#1f8a4c");

    // กลีบดอกไม้
    rings.forEach(ring => {
        for (let i = 0; i < ring.count; i++) {
            const angle = (360 / ring.count) * i + ring.offset;
            const radAngle = angle * Math.PI / 180;
            const bx = ring.radius * Math.cos(radAngle);
            const by = ring.radius * Math.sin(radAngle);

            generatePetalPoints([bx, by], radAngle, ring.length, ring.width, ring.color);
        }
    });

    // ดาววิ้งๆ กระจายทั่วจอ
    for (let i = 0; i < 20; i++) {
        const x = (Math.random() - 0.5) * canvas.width * 0.8;
        const y = Math.random() * canvas.height * 0.3 + canvas.height * 0.1;
        if (Math.hypot(x, y) > 100) {
            drawQueue.push({
                type: 'text',
                text: "✨",
                x: centerX + x,
                y: y,
                color: "#ffe6f2",
                font: "16px Arial"
            });
        }
    }
}

function triggerCompletionFireworks() {
    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;

    for (let i = 0; i < 80; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 8 + 2;
        fireworks.push({
            x: centerX,
            y: centerY,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            alpha: 1,
            color: `hsl(${Math.random() * 60 + 320}, 100%, 70%)`,
            size: Math.random() * 6 + 3
        });
    }
}

function startAnimation() {
    if (animationFrameId) {
        cancelAnimationFrame(animationFrameId);
    }
    resizeCanvas();
    buildDrawingSequence();
    fireworks = [];

    let index = 0;
    let frameCount = 0;
    const DELAY_FRAMES = 2;

    function animate() {
        frameCount++;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;

        ctx.save();
        ctx.translate(centerX + panX, centerY + panY);
        ctx.scale(scale, scale);
        ctx.translate(-centerX, -centerY);

        ctx.shadowBlur = 12;
        ctx.shadowColor = "rgba(255, 105, 180, 0.6)";

        for (let i = 0; i < index && i < drawQueue.length; i++) {
            const item = drawQueue[i];
            if (item.type === 'line') {
                ctx.strokeStyle = item.color;
                ctx.lineWidth = item.width;
                ctx.beginPath();
                ctx.moveTo(item.x1, item.y1);
                ctx.lineTo(item.x2, item.y2);
                ctx.stroke();
            } else if (item.type === 'text') {
                ctx.fillStyle = item.color;
                ctx.font = item.font;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(item.text, item.x, item.y);
            }
        }

        if (frameCount % DELAY_FRAMES === 0 && index < drawQueue.length) {
            index++;
            if (index === drawQueue.length) {
                triggerCompletionFireworks();
            }
        }

        // ละอองหัวใจรอยนิ้วมือ
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.alpha;
            ctx.font = `${p.size}px Arial`;
            ctx.fillText("💖", p.x, p.y);

            p.x += p.vx;
            p.y += p.vy;
            p.alpha -= 0.05;

            if (p.alpha <= 0) particles.splice(i, 1);
        }

        // พลุฉลอง
        for (let i = fireworks.length - 1; i >= 0; i--) {
            let f = fireworks[i];
            ctx.fillStyle = f.color;
            ctx.globalAlpha = f.alpha;
            ctx.beginPath();
            ctx.arc(f.x, f.y, f.size, 0, Math.PI * 2);
            ctx.fill();

            f.x += f.vx;
            f.y += f.vy;
            f.alpha -= 0.02;

            if (f.alpha <= 0) fireworks.splice(i, 1);
        }

        ctx.globalAlpha = 1;

        if (index >= drawQueue.length) {
            ctx.fillStyle = "#ffffff";
            ctx.font = `italic bold ${Math.round(20 * baseScale)}px Arial`;
            ctx.textAlign = "center";
            ctx.shadowBlur = 15;
            ctx.shadowColor = "#ff66b2";
            ctx.fillText("i love tan 💖", centerX, centerY + 280 * baseScale);
        }

        ctx.restore();

        animationFrameId = requestAnimationFrame(animate);
    }

    animate();
}

startAnimation();
</script>

</body>
</html>
