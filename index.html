<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Love Flower Mobile</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0d0208;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            overflow: hidden;
            touch-action: manipulation;
        }
        .container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
            max-width: 500px;
        }
        canvas {
            background-color: #0d0208;
            width: 100vw;
            height: 100vw;
            max-width: 450px;
            max-height: 450px;
            touch-action: none;
        }
        .controls {
            margin-top: 20px;
            z-index: 10;
        }
        button {
            background: linear-gradient(135deg, #e24888, #c72b6b);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            font-size: 15px;
            box-shadow: 0 4px 15px rgba(226, 72, 136, 0.4);
            transition: all 0.2s ease;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }
        button:active {
            transform: scale(0.95);
            opacity: 0.9;
        }
    </style>
</head>
<body>

<div class="container">
    <canvas id="flowerCanvas" width="800" height="800"></canvas>
    <div class="controls">
        <button onclick="startAnimation()">🌹 วาดใหม่อีกครั้ง</button>
    </div>
</div>

<script>
const canvas = document.getElementById('flowerCanvas');
const ctx = canvas.getContext('2d');

const WORD = "My Love";
const FONT = "bold 9px Arial";

let drawQueue = [];
let animationFrameId = null;

function generatePetalPoints(base, baseAngle, length, width, color, points = 20) {
    const bx = base[0];
    const by = base[1];
    const cosA = Math.cos(baseAngle);
    const sinA = Math.sin(baseAngle);

    for (let i = 0; i <= points; i++) {
        const theta = Math.PI * i / points;
        const out = length * Math.sin(theta);
        const side = width * Math.sin(theta) * Math.cos(theta);

        const rx = out * cosA - side * sinA;
        const ry = out * sinA + side * cosA;

        const px = 400 + (bx + rx);
        const py = 400 - (by + ry);

        drawQueue.push({
            type: 'text',
            text: WORD,
            x: px,
            y: py,
            color: color,
            font: FONT
        });
    }
}

function generateLeafPoints(base, angleDeg, length, width) {
    generatePetalPoints(base, angleDeg * Math.PI / 180, length, width, "#2aab57", 20);
}

const rings = [
    { radius: 0, count: 4, length: 40, width: 15, color: "#f8a3c7", offset: 45 },
    { radius: 10, count: 5, length: 60, width: 20, color: "#f271a9", offset: 0 },
    { radius: 20, count: 6, length: 75, width: 25, color: "#e24888", offset: 30 },
    { radius: 30, count: 7, length: 90, width: 30, color: "#c72b6b", offset: 15 },
    { radius: 40, count: 8, length: 105, width: 35, color: "#9d1f52", offset: 0 },
    { radius: 50, count: 12, length: 120, width: 40, color: "#7c1941", offset: 0 },
];

function buildDrawingSequence() {
    drawQueue = [];
    let currentPos = [0, -90];
    let currentHeading = 260;

    function addStemCircle(radius, angleDeg, color) {
        const steps = 30;
        const stepAngle = (angleDeg * Math.PI / 180) / steps;
        let radHeading = currentHeading * Math.PI / 180;

        for (let i = 0; i < steps; i++) {
            const startX = 400 + currentPos[0];
            const startY = 400 - currentPos[1];

            radHeading += stepAngle;
            const stepDist = (2 * Math.PI * radius * (angleDeg / 360)) / steps;
            currentPos[0] += stepDist * Math.cos(radHeading);
            currentPos[1] += stepDist * Math.sin(radHeading);

            const endX = 400 + currentPos[0];
            const endY = 400 - currentPos[1];

            drawQueue.push({
                type: 'line',
                x1: startX,
                y1: startY,
                x2: endX,
                y2: endY,
                color: color,
                width: 3.5
            });
        }
        currentHeading += angleDeg;
    }

    // ก้านและใบ
    addStemCircle(250, 25, "#1a5b32");
    let pos1 = [...currentPos], head1 = currentHeading;
    generateLeafPoints(pos1, head1 + 50, 50, 25);

    addStemCircle(250, 25, "#1a5b32");
    let pos2 = [...currentPos], head2 = currentHeading;
    generateLeafPoints(pos2, head2 - 50, 55, 28);

    addStemCircle(250, 30, "#1a5b32");
    let pos3 = [...currentPos], head3 = currentHeading;
    generateLeafPoints(pos3, head3 + 45, 50, 25);

    addStemCircle(250, 10, "#1a5b32");

    // ดอกไม้
    rings.forEach(ring => {
        for (let i = 0; i < ring.count; i++) {
            const angle = (360 / ring.count) * i + ring.offset;
            const radAngle = angle * Math.PI / 180;
            const bx = ring.radius * Math.cos(radAngle);
            const by = ring.radius * Math.sin(radAngle);

            generatePetalPoints([bx, by], radAngle, ring.length, ring.width, ring.color);
        }
    });

    // ดาววิ้งๆ
    for (let i = 0; i < 12; i++) {
        const x = (Math.random() - 0.5) * 500;
        const y = Math.random() * 100 + 150;
        if (Math.hypot(x, y) > 100) {
            drawQueue.push({
                type: 'text',
                text: "*",
                x: 400 + x,
                y: 400 - y,
                color: "#f7d9ec",
                font: "bold 16px Courier, monospace"
            });
        }
    }
}

function startAnimation() {
    if (animationFrameId) {
        cancelAnimationFrame(animationFrameId);
    }
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    buildDrawingSequence();

    let index = 0;
    
    // ตั้งค่าความเร็ว: DELAY_FRAMES ยิ่งมากยิ่งวาดช้าลง
    let frameCount = 0;
    const DELAY_FRAMES = 2; 

    function animate() {
        frameCount++;

        if (frameCount % DELAY_FRAMES === 0 && index < drawQueue.length) {
            const item = drawQueue[index];
            
            if (item.type === 'line') {
                ctx.strokeStyle = item.color;
                ctx.lineWidth = item.width;
                ctx.beginPath();
                ctx.moveTo(item.x1, item.y1);
                ctx.lineTo(item.x2, item.y2);
                ctx.stroke();
            } else if (item.type === 'text') {
                ctx.fillStyle = item.color;
                ctx.font = item.font;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(item.text, item.x, item.y);
            }

            index++;
        }

        if (index < drawQueue.length) {
            animationFrameId = requestAnimationFrame(animate);
        } else {
            ctx.fillStyle = "#ffffff";
            ctx.font = "italic 16px Arial";
            ctx.textAlign = "center";
            ctx.fillText("My Love Flower", 400, 765);
        }
    }

    animate();
}

startAnimation();
</script>

</body>
</html>
