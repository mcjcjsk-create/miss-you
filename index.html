<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heart Animation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: radial-gradient(circle at center, #1a1a2e 0%, #0f0f1b 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
    }

    .title {
      margin-bottom: 50px;
      font-size: 2rem;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(255, 46, 99, 0.6);
      animation: fadeIn 2s ease-in-out;
    }

    .heart-container {
      position: relative;
      cursor: pointer;
      user-select: none;
      transition: transform 0.2s ease;
    }

    .heart-container:hover {
      transform: scale(1.05);
    }

    /* รูปทรงหัวใจ */
    .heart {
      background-color: #ff2e63;
      display: inline-block;
      height: 100px;
      position: relative;
      transform: rotate(-45deg);
      width: 100px;
      animation: pulse 1.2s infinite ease-in-out;
      box-shadow: 0 0 40px rgba(255, 46, 99, 0.8), 0 0 80px rgba(255, 46, 99, 0.4);
    }

    .heart:before,
    .heart:after {
      content: "";
      background-color: #ff2e63;
      border-radius: 50%;
      height: 100px;
      position: absolute;
      width: 100px;
      box-shadow: inherit;
    }

    .heart:before {
      top: -50px;
      left: 0;
    }

    .heart:after {
      left: 50px;
      top: 0;
    }

    .instruction {
      margin-top: 60px;
      font-size: 0.95rem;
      opacity: 0.8;
      letter-spacing: 1px;
      animation: float 3s ease-in-out infinite;
    }

    /* อนิเมชันเต้นของหัวใจ */
    @keyframes pulse {
      0% { transform: rotate(-45deg) scale(1); }
      14% { transform: rotate(-45deg) scale(1.25); }
      28% { transform: rotate(-45deg) scale(1); }
      42% { transform: rotate(-45deg) scale(1.15); }
      70% { transform: rotate(-45deg) scale(1); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
  </style>
</head>
<body>

  <h1 class="title">Heart Animation</h1>

  <div class="heart-container" id="heartBtn">
    <div class="heart"></div>
  </div>

  <p class="instruction">💡 คลิกที่รูปหัวใจเพื่อปล่อยเอฟเฟกต์ประกายดวงดาว</p>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const heartBtn = document.getElementById('heartBtn');

      heartBtn.addEventListener('click', (e) => {
        const rect = heartBtn.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;

        // กระจายเอฟเฟกต์ละอองดาวเมื่อคลิก
        for (let i = 0; i < 16; i++) {
          createParticle(centerX, centerY);
        }
      });

      function createParticle(x, y) {
        const particle = document.createElement('div');
        document.body.appendChild(particle);

        const size = Math.random() * 18 + 8;
        const colors = ['#ff2e63', '#ff7597', '#ffb3c6', '#ffffff', '#e23e57'];
        const randomColor = colors[Math.floor(Math.random() * colors.length)];

        particle.style.width = `${size}px`;
        particle.style.height = `${size}px`;
        particle.style.background = randomColor;
        particle.style.position = 'absolute';
        particle.style.borderRadius = '50%';
        particle.style.boxShadow = `0 0 10px ${randomColor}`;
        particle.style.left = `${x}px`;
        particle.style.top = `${y}px`;
        particle.style.pointerEvents = 'none';
        particle.style.zIndex = '999';

        const angle = Math.random() * Math.PI * 2;
        const distance = Math.random() * 150 + 50;
        const destinationX = x + Math.cos(angle) * distance;
        const destinationY = y + Math.sin(angle) * distance;

        const animation = particle.animate([
          {
            transform: `translate(-50%, -50%) scale(1)`,
            opacity: 1
          },
          {
            transform: `translate(${destinationX - x}px, ${destinationY - y}px) scale(0)`,
            opacity: 0
          }
        ], {
          duration: 1000 + Math.random() * 500,
          easing: 'cubic-bezier(0.1, 0.8, 0.3, 1)'
        });

        animation.onfinish = () => {
          particle.remove();
        };
      }
    });
  </script>
</body>
</html>
